id: 'worldtree_beacon'
# WHETHER THE PLUGIN SHOULD LOAD THE SPELL. DEFAULT: TRUE
enabled: true

# NONE MEANS ITS DAMAGE DOES NOT SCALE WITH ELEMENTAL DAMAGE, ONLY MAGIC DAMAGE
element: 'LIGHT'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'RSSSS'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 8
required_circle: 8
required_focus: 153

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 90

# BASE CAST TIME (SECONDS)
cast_time: 2.75

# MANA COST
mana_cost: 450

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# HEALTH RESTORED TO EACH ALLY PER SECOND
heal_per_second: 1.0

# ABSORPTION HELD ON EACH ALLY WHILE INSIDE THE AURA
absorption: 4.0

# SUSTAIN - the worldtree mends allies and damages nothing, so it carries no power: key.
role: 'SUSTAIN'

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'YELLOW'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'OAK_SAPLING'
gui_custom_model_data: 4224

prepare_sound: 'BLOCK_AMETHYST_BLOCK_CHIME'
prepare_sound_volume: 0.6
prepare_sound_pitch: 1.2
cast_sound: 'BLOCK_BEACON_ACTIVATE'
cast_sound_volume: 0.8
cast_sound_pitch: 1.2
