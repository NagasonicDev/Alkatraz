id: 'inferno_rite'
enabled: true

# NONE MEANS ITS DAMAGE DOES NOT SCALE WITH ELEMENTAL DAMAGE, ONLY MAGIC DAMAGE
element: 'FIRE'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'SLSRL'

# WHAT THIS SPELL IS JUDGED ON. READ BY SpellBudgetTest.
role: 'BURST'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 9
required_focus: 161

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 20

# BASE CAST TIME (SECONDS). AT CIRCLE 6+ THE WIND-UP IS THE CAST TIME AND
# SpellBudgets.castTimeRange(9) IS A SINGLE POINT, 40 TICKS - SO 2.0 IS THE ONLY LEGAL
# VALUE AT CIRCLE 9.
cast_time: 2.0

# MANA COST
mana_cost: 600

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

power: 57.2                   # WAS 28.6. ONE DETONATION; UP TO 3 PER BODY = 171.6 <= burstBudget(9).

# THE MAXIMUM NUMBER OF DISCRETE DETONATIONS ONE CAST CAN PRODUCE, ACROSS THE WHOLE
# CHAIN. THIS IS THE HARD PER-CAST CAP ENFORCED BY A DECREMENTING CHARGE COUNTER IN
# THE IMPLEMENTATION - NOT AN ESTIMATE. 3 x 57.2 = 171.6, INSIDE burstBudget(9) = 180.0.
# READ BY SpellBudgetTest AND BY InfernoRiteConfig, SO THE ASSERTED TOTAL AND THE
# ENFORCED CEILING ARE THE SAME NUMBER.
hit_count: 3

# HOW MANY BODIES ONE DETONATION RE-IGNITES, NEAREST FIRST, SO THE FIRE KEEP
# SPREADING OUTWARD. CAPPED AT hit_count IN InfernoRiteConfig.detonationsPerTrigger(),
# SO THIS CAN NEVER RAISE THE PER-CAST TOTAL, WHICH hit_count ALREADY CAPS.
chain_targets_per_trigger: 2

# THE RADIUS OF THE OPENING IGNITION ARC AND OF EVERY RE-IGNITION A DETONATION
# SPREADS OVER. NOTHING HAS TO BE BURNING BEFORE THE RITE IS CAST.
chain_radius: 8.0

duration: 12.0                # WAS 8.0. THE ARMED WINDOW FOR THE CHAIN TO SPREAD OUTWARD.

# HOW MANY TICKS THE OPENING IGNITION RING AND ARC LAST. THE ARC SETS THE FIRE, THE
# RING IS THE TELL. NEITHER DEALS DAMAGE.
opening_ring_ticks: 12

ignite_ticks: 240             # BURN PERSISTS THROUGH THE 12s CHAIN WINDOW.

# HOW HARD A DETONATED BODY IS THROWN AWAY FROM THE STRUCK BODY, AND HOW HIGH.
detonation_knockback: 0.6
detonation_knockback_y: 0.5

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'PURPLE'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'SOUL_CAMPFIRE'
gui_custom_model_data: 4140

cast_sound: 'ITEM_FIRECHARGE_USE'
