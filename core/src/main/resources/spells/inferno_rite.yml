id: 'inferno_rite'
enabled: true

# NONE MEANS ITS DAMAGE DOES NOT SCALE WITH ELEMENTAL DAMAGE, ONLY MAGIC DAMAGE
element: 'FIRE'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'SLSRL'

# WHAT THIS SPELL IS JUDGED ON. READ BY SpellBudgetTest.
role: 'BURST'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 9
required_focus: 161

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 20

# BASE CAST TIME (SECONDS). AT CIRCLE 6+ THE WIND-UP IS THE CAST TIME AND
# SpellBudgets.castTimeRange(9) IS A SINGLE POINT, 40 TICKS - SO 2.0 IS THE ONLY LEGAL
# VALUE AT CIRCLE 9.
cast_time: 2.0

# MANA COST
mana_cost: 600

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# BASE DAMAGE PER SECONDARY DETONATION. SECTION 6 LADDER, CIRCLE 9. TAKEN VERBATIM.
# NOTE THIS IS NOT THE DAMAGE OF THE HIT THAT TRIGGERS THE RITE - THAT IS WHICHEVER
# SPELL THE CASTER USED, AND IT IS CHARGED AGAINST THAT SPELL'S OWN BUDGET.
power: 28.6

# THE MAXIMUM NUMBER OF DISCRETE DETONATIONS ONE CAST CAN PRODUCE, ACROSS THE WHOLE
# CHAIN. THIS IS THE HARD PER-CAST CAP ENFORCED BY A DECREMENTING CHARGE COUNTER IN
# THE IMPLEMENTATION - NOT AN ESTIMATE. 3 x 28.6 = 85.8, INSIDE burstBudget(9) = 90.0.
# READ BY SpellBudgetTest AND BY InfernoRiteConfig, SO THE ASSERTED TOTAL AND THE
# ENFORCED CEILING ARE THE SAME NUMBER.
hit_count: 3

# HOW MANY BODIES A SINGLE TRIGGERING HIT MAY DETONATE, NEAREST FIRST. CAPPED AT
# hit_count IN InfernoRiteConfig.detonationsPerTrigger(), SO THIS CAN NEVER RAISE THE
# PER-CAST TOTAL.
chain_targets_per_trigger: 2

# HOW FAR FROM THE STRUCK BODY A BURNING BODY MAY BE AND STILL DETONATE.
chain_radius: 8.0

# HOW LONG THE RITE STAYS ARMED, IN SECONDS. THIS IS AN ELIGIBILITY WINDOW, NOT A
# DAMAGE CADENCE - the rite has NO damage timer at all, and no runnable in this spell
# ever deals damage. The window-expiry runnable only removes the rite from the map.
duration: 8.0

# HOW MANY TICKS THE OPENING IGNITION RING LASTS. PARTICLES ONLY, NO DAMAGE.
opening_ring_ticks: 12

# HOW MANY TICKS A DETONATED BODY IGNITES ITS OWN CHILDREN FOR. THE RITE IGNITES
# NOTHING - IT PROPAGATES FIRES THAT ALREADY EXIST, WHICH IS WHY THE CANDIDATE FILTER
# REQUIRES candidate.getFireTicks() > 0 AND A DETONATION CONSUMES THE BURN WITH
# setFireTicks(0).
ignite_ticks: 40

# HOW HARD A DETONATED BODY IS THROWN AWAY FROM THE STRUCK BODY, AND HOW HIGH.
detonation_knockback: 0.6
detonation_knockback_y: 0.5

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'PURPLE'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'SOUL_CAMPFIRE'
gui_custom_model_data: 4140

cast_sound: 'ITEM_FIRECHARGE_USE'