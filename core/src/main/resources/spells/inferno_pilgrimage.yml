id: 'inferno_pilgrimage'
enabled: true

# NONE MEANS ITS DAMAGE DOES NOT SCALE WITH ELEMENTAL DAMAGE, ONLY MAGIC DAMAGE
element: 'FIRE'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'SLRLR'

# WHAT THIS SPELL IS JUDGED ON. READ BY SpellBudgetTest.
role: 'BURST'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 7
required_focus: 144

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 13

# BASE CAST TIME (SECONDS). AT CIRCLE 6+ SpellBudgets.castTimeRange COLLAPSES TO A SINGLE
# POINT AND CIRCLE 7's IS 25 TICKS, SO 1.25 IS THE ONLY LEGAL VALUE AT CIRCLE 7.
cast_time: 1.25

# MANA COST
mana_cost: 240

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# BASE DAMAGE PER PULSE. SECTION 6 LADDER CIRCLE 7 IS 18.9; THIS IS THE DOCUMENTED
# SPEC SECTION 9 DEVIATION - three discrete bursts of 16 rather than one of 18.9.
# 16 x hit_count(3) = 48.0, which IS burstBudget(7) exactly.
power: 16

# THE NUMBER OF DISCRETE DAMAGE APPLICATIONS ONE CAST MAKES TO A SINGLE TARGET AT
# DEFAULT OPTIONS. THIS IS NOT A DOT CADENCE - IT IS A COUNT OF THREE WHOLE BURSTS
# FIRED AT TICKS 0, 8 AND 16. READ BY SpellBudgetTest AND BY InfernoPilgrimageConfig,
# so the number the budget test asserts is the number the wall actually fires.
hit_count: 3

# TICKS BETWEEN PULSES. 3 PULSES x 8 TICKS = 16 TICKS = 0.8 SECONDS, SO THE WHOLE
# SEQUENCE IS FRONT-LOADED INSIDE ONE SECOND. THIS IS THE PULSE SPACING, NOT A TICK.
pulse_interval_ticks: 8

# HOW LONG THE WALL TRAVELS BEFORE IT DISSIPATES.
travel_ticks: 24

# HOW FAST THE WALL FRONT ADVANCES, IN BLOCKS PER TICK.
# travel_ticks 24 x wall_speed 0.75 = 18 BLOCKS OF TRAVEL.
wall_speed: 0.75

# THE VISIBLE CURTAIN: 5 CELLS WIDE, 3 CELLS TALL, IN FRONT OF THE CASTING CIRCLE.
wall_width: 5
wall_height: 3

# HOW FAR ABOVE THE CASTER'S FEET THE WALL'S CENTRE LINE SITS. CHEST HEIGHT.
wall_center_height: 1.0

# HOW FAR BEYOND THE FRONT EACH PULSE'S SWEEP REACHES, ALONG THE LOOK DIRECTION.
# 8.0 IS WHAT MAKES THE THREE PULSE WINDOWS OVERLAP, SO A TARGET NEAR THE CASTER IS
# INSIDE ALL THREE AND THE PER-TARGET WORST CASE IS EXACTLY power x hit_count.
pulse_reach: 8.0

# THE HALF-WIDTH AND VERTICAL HALF-HEIGHT OF ONE PULSE'S SLAB, MEASURED FROM THE
# WALL'S CENTRE LINE AND FROM AN ENTITY'S MID-BODY (EYES MINUS 0.9).
pulse_width: 3.5
pulse_height: 2.0

# HOW MANY TICKS EACH TARGET IGNITION BURNS FOR. ONE DISCRETE IGNITION PER PULSE -
# NEVER REFRESHED. fire never sustains (spec section 5.1).
ignite_ticks: 40

# HOW HARD A TARGET IS SHOVED ALONG THE WALL, AND HOW HIGH.
knockback: 0.4
knockback_y: 0.3

# THE PILGRIMAGE ITSELF: THE CASTER IS PULLED ALONG THE LOOK DIRECTION FOR THE FIRST
# 8 TICKS AT 0.3 BLOCKS/TICK (AT MOST 2.4 BLOCKS), SO THE CAST VISIBLY WALKS ITS OWN
# PATH. VERTICAL VELOCITY IS PRESERVED - THE ESCORT NEVER LIFTS THE CASTER.
escort_ticks: 8
escort_speed: 0.3

# HOW LONG THE WALL TAKES TO BURN OUT AFTER IT STOPS. PARTICLES ONLY, NO DAMAGE.
dissipate_ticks: 10

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'RED'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'CAMPFIRE'
gui_custom_model_data: 4138

cast_sound: 'ENTITY_BLAZE_AMBIENT'