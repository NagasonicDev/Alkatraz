id: 'choir_of_light'
# WHETHER THE PLUGIN SHOULD LOAD THE SPELL. DEFAULT: TRUE
enabled: true

# LIGHT IS THE COUNTER-ELEMENT. THE X2.0 AGAINST THE UNDEAD AND THE UP-TO-X2.5 DARK
# AFFINITY GAP ARE APPLIED AUTOMATICALLY INSIDE AttackSpell.getPower, NOT HERE.
element: 'LIGHT'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'RSSRL'

# THE CHOIR LANDS ONCE PER TARGET AND STOPS. THE SEEKING IS WHAT MAKES IT EXPENSIVE.
role: 'BURST'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 7
required_focus: 144

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 13

# BASE CAST TIME (SECONDS). SpellBudgets.castTimeRange(7) COLLAPSES TO THE SINGLE POINT
# 25 TICKS, SO 1.25 IS THE ONLY LEGAL CIRCLE-7 CAST TIME - NOT THE 2.0 OF THE OLD
# SECTION 6 SINGLE-VALUE LADDER, WHICH CAST TIME AS A RANGE RETIRED.
cast_time: 1.25

# MANA COST
mana_cost: 240

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# BASE DAMAGE PER SHARD. THE DEFAULT VOLLEY IS 2 SHARDS, SO 18.9 x 2 = 37.8,
# INSIDE THE CIRCLE-7 BURST BUDGET OF 48.0.
power: 18.9

# SHARDS PER CAST AT DEFAULT OPTIONS. EACH SHARD LOCKS A DISTINCT TARGET AND IS ONE
# DISCRETE DAMAGE APPLICATION - AttackProperties.hasHit IS PER-CAST, SO A VOLLEY
# AIMED TWICE AT ONE TARGET WOULD LAND power ONCE, NOT power x 2.
shard_count: 2

# THE CONTRACT'S MULTI-HIT DECLARATION: SpellBudgetTest READS power x hit_count AS
# THE PER-CAST TOTAL, WHICH IS 18.9 x 2 = 37.8, INSIDE THE BUDGET OF 48.0.
hit_count: 2

# BLOCKS A SHARD TRAVELS PER TICK
shard_speed: 0.9

# BLOCKS A SHARD TRAVELS BEFORE IT DISSIPATES
shard_range: 28.0

# SECONDS A SEEKING SHARD LIVES. THE RANGE ABOVE BINDS FIRST AT THE DEFAULTS
# (28 / 0.9 IS ABOUT 32 TICKS, AGAINST 50 HERE).
shard_lifetime: 2.5

# SECONDS THE SHARDS ORBIT THE CASTER BEFORE THEY LAUNCH
orbit_duration: 0.5

# HOW FAR A SHARD MAY BE SENT, AND HOW FAR IT WILL STAY LOCKED ON
lock_range: 32.0

# DEGREES OF YAW SPREAD ACROSS THE VOLLEY
spread_degrees: 24.0

# RADIUS OF THE ORBITING RING
orbit_radius: 2.2

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'BLUE'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'PRISMARINE_SHARD'
gui_custom_model_data: 4156

prepare_sound: 'BLOCK_CONDUIT_AMBIENT_SHORT'
cast_sound: 'ENTITY_PLAYER_LEVELUP'
