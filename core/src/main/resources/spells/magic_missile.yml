id: 'magic_missile'
display_name: '&bMagic Missile'
description:
  - '&7A short burst of mana that'
  - '&7deals small damage to enemies.'
# WHETHER THE PLUGIN SHOULD LOAD THE SPELL. DEFAULT: TRUE
enabled: true

# NONE MEANS ITS DAMAGE DOES NOT SCALE WITH ELEMENTAL DAMAGE, ONLY MAGIC DAMAGE
element: 'NONE'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'RRRRR'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 0
required_focus: 0

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 2

# BASE CAST TIME (SECONDS)
cast_time: 0.25

# MANA COST
mana_cost: 5

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 250

# THE ONE BURST ON ELEMENT NONE. SpellBudgets.isGrandfatheredBurst allowlists
# exactly magic_missile at circle 0; every other NONE spell is UTILITY or DENIAL.
role: 'BURST'

power: 1.5

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'BLUE'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'IRON_NUGGET'
gui_custom_model_data: 4101
