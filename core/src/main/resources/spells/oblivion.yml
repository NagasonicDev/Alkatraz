id: 'oblivion'
# WHETHER THE PLUGIN SHOULD LOAD THE SPELL. DEFAULT: TRUE
enabled: true

# ELEMENT TYPE
element: 'DARK'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'RSLRL'

# BURST / SUSTAIN / TERRAIN / DENIAL / UTILITY - MUST BE ALLOWED FOR THE ELEMENT.
# DARK ALLOWS {UTILITY, SUSTAIN, BURST}. DENIAL IS FORBIDDEN OUTRIGHT.
role: 'SUSTAIN'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 9
required_focus: 161

# NO COOLDOWN. THE CAST ITSELF IS THE TOGGLE: CAST AGAIN TO CLOSE THE HOLE, SO A COOLDOWN
# WOULD ONLY STOP THE PLAYER FROM TURNING IT OFF.
cooldown: 0

# BASE CAST TIME (SECONDS). SpellBudgets.castTimeRange(9) COLLAPSES TO THE SINGLE POINT
# 40 TICKS, SO 2.0 IS THE ONLY LEGAL CIRCLE-9 CAST TIME - NOT THE 3.0 OF THE OLD SECTION
# 6 SINGLE-VALUE LADDER, WHICH CAST TIME AS A RANGE RETIRED.
cast_time: 2.0

# MANA COST
mana_cost: 600

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# BASE POWER PER OPENING. 28.0 x hit_count 10 = 280.0, EXACTLY SpellBudgets.sustainBudget(9).
# THERE IS NO MISSING-HEALTH MULTIPLIER ANY MORE: SCALING OFF WHAT A TARGET HAS ALREADY LOST
# MEANT MINIMUM DAMAGE AGAINST A FULL-HEALTH BOSS, WHICH IS WHY THE SPELL READ AS WEAK.
power: 28.0

# HOW MANY TIMES THE HOLE OPENS ACROSS ITS WHOLE LIFE. SpellBudgetTest.declaredTotal READS
# power x hit_count FOR THIS ID, SO BOTH KEYS ARE LOAD-BEARING.
hit_count: 10

# THE HOLE'S WHOLE LIFE, AND THE CAP Chasm#tick ENFORCES. WITHOUT IT THE MANA ALONE DECIDES HOW
# LONG THE SPELL LASTS, AND THE DECLARATION ABOVE IS A LIE: 9400 MANA / (75 UPKEEP - 15 REGEN) =
# 156.7s OF UPKEEP, WHICH IS 26 OPENINGS x 28.0 = 728.0, 2.6x THE 280.0 SUSTAIN BUDGET.
# A 60s CAP IS WHAT HOLDS THE 28.0 x 10 = 280.0 DECLARATION TRUE.
duration_seconds: 24.0

# TICKS BETWEEN DAMAGE OPENINGS. 120 TICKS = 6s, AND duration_seconds 60s DIVIDED BY 6s IS THE
# 10 IN hit_count.
damage_interval_ticks: 48

# TARGETING
target_range: 24.0

# HOW MUCH THE HOLE TAKES OUT OF THE CASTER EVERY SECOND WHILE IT IS OPEN. IT ENDS BY
# ITSELF WHEN THE MANA RUNS OUT, SO THE 600 CAST COST IS NOT THE WHOLE PRICE.
upkeep_mana_per_second: 75

# HOSTILE PROJECTILES INSIDE THIS RADIUS ARE PULLED IN AND DESTROYED.
chasm_radius: 3.0

# A QUARTER OF EVERY POINT OF DAMAGE THE HOLE DEALS RETURNS TO THE CASTER AS HEALTH,
# ACROSS EVERY SOURCE IT TOUCHES.
vampirism_ratio: 0.25

# THE CURSE. RE-APPLIED EVERY OPENING, AND REMOVED BY THE TEARDOWN WHEN THE HOLE CLOSES.
debuff_duration: 12
debuff_weakness_amplifier: 2
debuff_blindness_amplifier: 1

# THE HOLE APPLIES WITHER, NOT JUST WEAKNESS AND BLINDNESS.
debuff_wither_amplifier: 1

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'RED'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'SCULK_CATALYST'
gui_custom_model_data: 4161

prepare_sound: 'ENTITY_WITHER_AMBIENT'
prepare_sound_volume: 0.4
prepare_sound_pitch: 0.6
cast_sound: 'ENTITY_ENDERMAN_TELEPORT'
cast_sound_volume: 1.0
cast_sound_pitch: 0.4
