id: 'undertow'
display_name: '&9Undertow'
description:
  - '&7Calls a riptide that hauls one'
  - '&7enemy toward you. The further it'
  - '&7drags them, the more they suffer.'
enabled: true

element: 'WATER'

# WATER OWNS SUSTAIN, DENIAL AND BURST. NEVER TERRAIN - water moves and wears,
# it never reshapes land.
role: 'BURST'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'LSSLL'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 6
required_focus: 135

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 11

# BASE CAST TIME (SECONDS). SpellBudgets.castTimeRange COLLAPSES CIRCLE 6 TO A SINGLE POINT
# OF 20 TICKS, SO 1.0 IS THE ONLY LEGAL VALUE HERE - THE WITHDRAWN SECTION 6 LADDER COLUMN
# SAID 1.75. THE FRAMEWORK SPENDS THIS BEFORE castAction IS REACHED. UNDERTOW DECLARES NO
# CHANNEL AND NO wind_up_duration, SO NOTHING IS ADDED ON TOP OF IT: drag_duration_ticks
# BELOW IS THE PULL, WHICH STARTS AFTER THE CAST HAS ALREADY RESOLVED.
cast_time: 1.0

# MANA COST
mana_cost: 165

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# SPEC SECTION 6 LADDER, CIRCLE 6. THIS IS THE FLOOR OF THE SPELL: A TARGET THAT IS
# BARELY MOVED STILL TAKES THIS MUCH. THE SCALED TOTAL SITS ON TOP OF IT, AND BOTH
# ENDS OF THAT RANGE ARE INSIDE burstBudget(6) = 34.1. WITHOUT THE FLOOR, `power`
# WOULD NEVER REACH SpellDamageUtil.damageWithSpell ON A RESISTANT PULL.
power: 14.8

# DAMAGE PER BLOCK DRAGGED. THE PULL IS THE MECHANIC, SO THE DAMAGE A TARGET TAKES IS
# A FUNCTION OF HOW FAR THEY WERE DRAGGED, NOT A FLAT HIT.
#     4.0 x 12.0 = 48.0, CLAMPED BY drag_damage_cap TO 34.1
drag_damage_per_block: 4.0

# THE FURTHEST A TARGET CAN BE DRAGGED AT THE DEFAULT OPTIONS.
max_drag_distance: 12.0

# HARD CEILING ON THE SCALED TOTAL. 12 x 4.0 = 48, CAPPED TO THE CIRCLE-6 BURST
# BUDGET. SpellBudgetTest READS EXACTLY THESE THREE KEYS AND COMPUTES
#     min(drag_damage_per_block * max_drag_distance, drag_damage_cap)
drag_damage_cap: 34.1

# HOW FAR THE CASTER CAN REACH TO CHOOSE THE TARGET.
drag_range: 24.0

# HOW LONG THE DRAG RUNS, IN TICKS.
drag_duration_ticks: 20

# BLOCKS OF DISPLACEMENT PER TICK. 0.6 x 20 = 12.0 = max_drag_distance, SO THE DRAG
# CAN EXACTLY REACH ITS OWN DAMAGE CEILING AND NOT ONE BLOCK FURTHER. THE FIVETH TEST
# ASSERTS THIS INVARIANT: WITHOUT IT THE DECLARED 48.0 CEILING WOULD BE UNREACHABLE
# AND THIS FILE WOULD BE LYING ABOUT THE SPELL.
drag_step_per_tick: 0.6

# THE DRAG STOPS WHEN THE TARGET IS THIS CLOSE TO THE CASTER.
drag_stop_distance: 2.0

# UPWARD VELOCITY LEFT ON THE TARGET EACH TICK, SO THE PULL READS AS A RIP.
drag_lift: 0.35

# NOTE: NO hit_count KEY, AND THAT IS CORRECT. THE DRAG DEALS EXACTLY ONE DAMAGE
# INSTANCE PER CAST - props.hasHit/hit guards it - so A HIT COUNT WOULD UNDERSTATE
# NOTHING AND MISLEAD ABOUT WHAT THE SPELL ACTUALLY DOES. SpellBudgetTest SPECIAL-CASES
# `undertow` TO THE SCALED CEILING ABOVE INSTEAD.

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'BLUE'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'HEART_OF_THE_SEA'
gui_custom_model_data: 4141

cast_sound: 'ENTITY_DROWNED_SWIM'