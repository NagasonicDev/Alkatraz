id: 'apotheosis'
display_name: '&dLitany of the Ascendant'
description:
  - '&7Stand still while the light climbs,'
  - '&7and it will climb through you.'
  - '&7Your own spells cost less and hit'
  - '&7harder while it holds.'
# WHETHER THE PLUGIN SHOULD LOAD THE SPELL. DEFAULT: TRUE
enabled: true

# LIGHT IS THE COUNTER-ELEMENT - BUT THIS SPELL DEALS NO DAMAGE AT ALL, SO THE
# ANTI-DARK AMPLIFICATION NEVER REACHES IT.
element: 'LIGHT'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'RSSSS'

# A TRANSFORMATION IS NOT A DAMAGE ROLE. UTILITY SPELLS ARE JUDGED ON NOTHING, AND
# A power KEY ON ONE OF THEM IS DEAD CONFIG - SpellBudgetTest SAYS SO EXPLICITLY.
role: 'UTILITY'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 8
required_focus: 153

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 16

# BASE CAST TIME (SECONDS). SpellBudgets.castTimeRange(8) COLLAPSES TO THE SINGLE POINT
# 30 TICKS, SO 1.5 IS THE ONLY LEGAL CIRCLE-8 CAST TIME - NOT THE 2.25 OF THE OLD
# SECTION 6 SINGLE-VALUE LADDER, WHICH CAST TIME AS A RANGE RETIRED. THE 6-SECOND
# channel_duration BELOW IS A SEPARATE, SPELL-SPECIFIC TIMER AND IS NOT DERIVED FROM IT.
cast_time: 1.5

# MANA COST
mana_cost: 450

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# SECONDS OF STANDING STILL BEFORE THE TRANSFORMATION LANDS
channel_duration: 6.0

# SECONDS THE ASCENDANT HOLDS AFTER THE CHANNEL COMPLETES
buff_duration: 30.0

# RADIUS OF THE LIGHT THAT CLIMBS AND FOLLOWS THE CASTER
aura_radius: 6.0

# BLOCKS OF MOVEMENT THAT BREAK THE CHANNEL. A TWITCH OF THE MOUSE MUST NOT.
move_cancel_threshold: 0.3

#THERE IS NO power KEY AND NO hit_count KEY. THIS SPELL DEALS NO DAMAGE.

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'PURPLE'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'NETHER_STAR'
gui_custom_model_data: 4157

prepare_sound: 'BLOCK_BEACON_ACTIVATE'
cast_sound: 'ENTITY_PLAYER_LEVELUP'
