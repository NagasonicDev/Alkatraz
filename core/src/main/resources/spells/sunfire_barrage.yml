id: 'sunfire_barrage'
display_name: '&6Sunfire Barrage'
description:
  - '&7Hold still and the sun finds five things to'
  - '&7burn. Move, or get hit, and it finds nothing.'
enabled: true

# NONE MEANS ITS DAMAGE DOES NOT SCALE WITH ELEMENTAL DAMAGE, ONLY MAGIC DAMAGE
element: 'FIRE'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'RSLSL'

# WHAT THIS SPELL IS JUDGED ON. READ BY SpellBudgetTest.
role: 'BURST'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 8
required_focus: 153

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 16

# BASE CAST TIME (SECONDS). SpellBudgets.castTimeRange COLLAPSES CIRCLE 8 TO A SINGLE
# POINT OF 30 TICKS, SO 1.5 IS THE ONLY LEGAL VALUE HERE. THE FRAMEWORK SPENDS THIS
# BEFORE castAction IS REACHED; THE CHANNEL BELOW IS THE SPELL'S OWN AND IS DECLARED
# SEPARATELY, EXACTLY AS warp AND skeletal_knights DO.
cast_time: 1.5

# MANA COST
mana_cost: 450

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# BASE DAMAGE PER STRIKE. SECTION 6 LADDER, CIRCLE 8. TAKEN VERBATIM, NOT INVENTED.
power: 22.7

# THE NUMBER OF DISCRETE DAMAGE APPLICATIONS ONE CAST CAN MAKE TO A SINGLE TARGET.
# 2 IS max_strikes_per_target: A BODY MAY BE STRUCK TWICE AND NO MORE, EVEN WHEN THE
# MARK LIST IS SHORTER THAN strike_count. 2 x 22.7 = 45.4, INSIDE burstBudget(8) = 64.1.
# READ BY SpellBudgetTest AND BY SunfireBarrageConfig, SO THE ASSERTED TOTAL AND THE
# ENFORCED CAP ARE THE SAME NUMBER.
hit_count: 2

# HOW MANY PIECES OF THE SUN FALL IN TOTAL. WITH 5 MARKS EACH BODY TAKES ONE; WITH
# FEWER MARKS THE SURPLUS RE-STRIKES, CAPPED AT hit_count.
strike_count: 5

# HOW MANY BODIES THE CHANNEL WILL MARK AT MOST.
max_marks: 5

# HOW FAR FROM THE CASTER A MARKED BODY MAY BE.
mark_radius: 18.0

# HOW OFTEN THE CHANNEL SCANS FOR A NEW MARK. 40 CHANNEL TICKS / 4 = 10 SCAN
# OPPORTUNITIES FOR 5 MARKS.
mark_interval_ticks: 4

# THE CHANNEL LENGTH, IN WHOLE SECONDS: 40 TICKS AT BASE MASTERY, 30 (0.75x) AT MAXIMUM
# MASTERY. IT MUST BE A WHOLE NUMBER OF SECONDS - SunfireBarrageConfig reads it with intOf
# and multiplies by 20, so a fractional value here (1.5, say) is silently truncated and the
# channel comes out a full second shorter than this file claims. THE CHANNEL RUNS THROUGH
# THE SHARED WindUp/ChannelRegistry PAIR, exactly as Warp and SkeletalKnights do, and
# ChannelRegistry owns the interruption.
wind_up_duration: 2

# HOW LONG AFTER THE CHANNEL THE FIRST PIECE FALLS, AND HOW MANY TICKS BETWEEN
# PIECES. 6 + 5 x 2 = 16 TICKS = 0.8 SECONDS, SO ALL FIVE IMPACTS LAND INSIDE ONE
# SECOND OF EACH OTHER. THESE ARE STRIKE SPACINGS, NOT A DAMAGE TICK.
strike_delay_ticks: 6
strike_interval_ticks: 2

# HOW FAR THE CASTER MAY DRIFT DURING THE CHANNEL BEFORE IT BREAKS. READ FROM THIS KEY
# BY WindUp.moveCancelThreshold, WHICH IS WHAT ChannelRegistry CONSULTS ON EVERY MOVE
# EVENT. IDENTICAL TO Warp AND SkeletalKnights, SO TURNING THE MOUSE IS FINE BUT STEPPING
# IS NOT.
move_cancel_threshold: 0.25

# HOW HIGH EACH STRUCK BODY IS KNOCKED.
knock_up: 0.9

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'RED'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'AMETHYST_SHARD'
gui_custom_model_data: 4139

cast_sound: 'ENTITY_BLAZE_SHOOT'