id: 'world_gate'
# WHETHER THE PLUGIN SHOULD LOAD THE SPELL. DEFAULT: TRUE
enabled: true

# NONE MEANS ITS DAMAGE DOES NOT SCALE WITH ELEMENTAL DAMAGE, ONLY MAGIC DAMAGE
element: 'NONE'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'SLSLL'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 9
required_circle: 9
required_focus: 161

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 180

# BASE CAST TIME (SECONDS)
cast_time: 3.50

# MANA COST
mana_cost: 600

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# HOW LONG THE FIRST GATE'S ORIGIN STAYS ARMED, IN SECONDS
origin_window: 180

# HOW LONG BOTH GATES STAY OPEN, IN SECONDS
open_for: 60

# UTILITY - opens a paired portal without dealing damage, so it carries no power: key.
role: 'UTILITY'

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'WHITE'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'END_PORTAL_FRAME'
gui_custom_model_data: 4228

prepare_sound: 'BLOCK_PORTAL_TRIGGER'
prepare_sound_volume: 0.5
prepare_sound_pitch: 1.0
cast_sound: 'BLOCK_END_PORTAL_SPAWN'
cast_sound_volume: 0.8
cast_sound_pitch: 0.8
