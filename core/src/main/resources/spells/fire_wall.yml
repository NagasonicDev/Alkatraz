id: 'fire_wall'
# WHETHER THE PLUGIN SHOULD LOAD THE SPELL. DEFAULT: TRUE
enabled: true

# NONE MEANS ITS DAMAGE DOES NOT SCALE WITH ELEMENTAL DAMAGE, ONLY MAGIC DAMAGE
element: 'FIRE'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'SSSRR'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 3
required_focus: 65

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 6

# BASE CAST TIME (SECONDS)
cast_time: 1.5

# MANA COST
mana_cost: 48

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

power: 5.5

# WHAT THIS SPELL IS JUDGED ON. READ BY Spell.loadConfiguration AND SpellBudgetTest.
role: 'DENIAL'

# HOW LONG THE WALL LASTS. DEFAULT: 12.5
duration: 12.5

# HOW HIGH THE WALL IS (BLOCKS). DEFAULT: 3
height: 3

# THE LENGTH OF THE WALL (BLOCKS). DEFAULT: 25
length: 25

# THE HITPOINTS OF THE DEFENSE-SIDE BARRIER PROPERTIES SO INCOMING ATTACKS ARE
# CONSUMED INSTEAD OF PASSING THROUGH. The wall now blocks projectiles and takes
# a share of incoming hits, per spec section 8.1.
barrier_hitpoints: 60.0

# HOW HARD A TARGET IS SHOVED AWAY FROM THE WALL NORMAL ON CONTACT.
# Modelled on Barrier.java:105-109.
push_strength: 0.35

# HOW MANY TICKS THE ENTRY IGNITION BURST BURNS THE TARGET FOR. FIRE NEVER SUSTAINS,
# SO THIS IS ONE DISCRETE BURST, NOT A REFRESHED DOT.
ignite_ticks: 40

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'RED'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'BLAZE_POWDER'
gui_custom_model_data: 4135
