id: 'wraithbound_retinue'
# WHETHER THE PLUGIN SHOULD LOAD THE SPELL. DEFAULT: TRUE
enabled: true

# NONE MEANS ITS DAMAGE DOES NOT SCALE WITH ELEMENTAL DAMAGE, ONLY MAGIC DAMAGE
element: 'DARK'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'SRRLS'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 6
required_focus: 135

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 50

# BASE CAST TIME (SECONDS)
cast_time: 2.25

# MANA COST
mana_cost: 165

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# ONE SENTINEL STRIKE. NOT A CAST HIT - THE CAST ITSELF DEALS NOTHING
power: 4

# HOW MANY STRIKES EACH SENTINEL LANDS BEFORE IT GOES QUIET
hit_count: 8

# HOW LONG THE RETINUE STAYS, IN SECONDS
retinue_duration: 45

# UTILITY - the sentinels do the biting, so the cast itself carries the strike power above.
role: 'UTILITY'

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'PURPLE'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'WITHER_SKELETON_SKULL'
gui_custom_model_data: 4211

cast_sound: 'ENTITY_WITHER_SHOOT'
cast_sound_pitch: 1.4
