id: 'swift'
display_name: '&fSwift'
description:
  - '&7Generates a gust of air behind the caster,'
  - '&7propelling them forward.'
# WHETHER THE PLUGIN SHOULD LOAD THE SPELL. DEFAULT: TRUE
enabled: true

# NONE MEANS ITS DAMAGE DOES NOT SCALE WITH ELEMENTAL DAMAGE, ONLY MAGIC DAMAGE
element: 'AIR'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'RLLRS'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 2
required_focus: 40

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 5

# BASE CAST TIME (SECONDS)
cast_time: 0.25

# MANA COST
mana_cost: 24

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 500

# WHAT THE SPELL IS JUDGED ON. Swift is a mobility dash and correctly extends bare
# Spell, so it carries NO power key at all.
role: 'UTILITY'

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'WHITE'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'RABBIT_FOOT'
gui_custom_model_data: 4127

#THE STRENGTH OF THE DASH. DEFAULT: 1.5
dash_strength: 1.5
