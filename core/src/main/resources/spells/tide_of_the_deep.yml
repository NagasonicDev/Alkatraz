id: 'tide_of_the_deep'
enabled: true

element: 'WATER'

# WATER OWNS SUSTAIN, DENIAL AND BURST. NEVER TERRAIN - water moves and wears, it never
# reshapes land.
role: 'SUSTAIN'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'LSSSR'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 9
required_focus: 161

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 20

# BASE CAST TIME (SECONDS). SpellBudgets.castTimeRange COLLAPSES CIRCLE 9 TO A SINGLE POINT
# OF 40 TICKS, SO 2.0 IS THE ONLY LEGAL VALUE HERE - THE WITHDRAWN SECTION 6 LADDER COLUMN
# SAID 3.0. THE FRAMEWORK SPENDS THIS BEFORE castAction IS REACHED. TIDE_OF_THE_DEEP
# DECLARES NO CHANNEL AND NO wind_up_duration, SO NOTHING IS ADDED ON TOP OF IT:
# duration_seconds BELOW IS THE TIDE'S LIFE, WHICH STARTS AFTER THE CAST HAS ALREADY
# RESOLVED. THE TEN-WINDOW RAMP AND hit_count ARE BUDGETED AGAINST duration_seconds, NOT
# AGAINST THIS KEY, SO NEITHER MOVES.
cast_time: 2.0

# MANA COST
mana_cost: 600

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# DEVIATION FROM SPEC SECTION 6, DOCUMENTED WITH ITS ARITHMETIC. THE SECTION 6 LADDER
# VALUE FOR CIRCLE 9 IS 28.6, BUT hit_count MUST EQUAL duration_seconds AND MUST BE 10 FOR
# THE TEN-SECOND RAMP, SO:
#     28.6 x 10 = 286.0  >  144   (THE LADDER VALUE DOES NOT FIT)
#     144 / 10  = 14.4             (THE ONLY PER-HIT VALUE THAT DOES)
# 14.4 x 10 = 144.0, EXACTLY THE CIRCLE-9 SUSTAIN BUDGET - THE SAME SHAPE AS
# inferno_pilgrimage's 3 x 16 = 48, A DELIBERATE BUDGET-CHECKED DEPARTURE.
power: 14.4

# A SUSTAIN FIELD DAMAGES A TARGET AT MOST ONCE EVERY SpellAttackContext.DAMAGE_INTERVAL_TICKS
# (20 TICKS), AND hit_count EQUALS duration_seconds. 10.0 s AT ONE HIT PER 20-TICK WINDOW
# IS EXACTLY 10 WINDOWS.
#     14.4 x 10 = 144.0  ==  sustainBudget(9)
# TideOfTheDeep.java ENFORCES THIS COUNT RATHER THAN ONLY DOCUMENTING IT, SO RAISING
# duration_seconds IN AN ADMIN'S COPY CANNOT QUIETLY PUSH THE SPELL PAST THE BUDGET.
hit_count: 10
duration_seconds: 10.0

# THE RAMP. WINDOW i DEALS power x tide_ramp[i].
#     0.40 + 0.52 + 0.64 + 0.76 + 0.88 + 1.00 + 1.12 + 1.24 + 1.36 + 1.48 = 9.40
#     worst single target = 14.4 x 9.40 = 135.36, inside the budget of 144
#     first window 5.76 -> last window 21.31, a 3.7x climb the player can read on screen
tide_ramp: [0.40, 0.52, 0.64, 0.76, 0.88, 1.00, 1.12, 1.24, 1.36, 1.48]

# RADIUS OF THE TIDE IN BLOCKS.
tide_radius: 8.0

# HOW FAR THE CASTER CAN REACH TO PLACE THE TIDE.
target_range: 20.0

# FRACTION OF DAMAGE DEALT THAT THE CASTER RECEIVES AS HEALTH, CAPPED AT ONE WINDOW'S
# WORTH OF RAMPED POWER AND AT MAX HEALTH. THE CASTER IS THE ONLY HEALED ENTITY, AND ONLY
# WHILE STANDING IN THE TIDE - WALKING OUT STOPS THE HEAL BUT NOT THE DAMAGE.
heal_ratio: 0.5

# HORIZONTAL VELOCITY NUDGED INTO DROWNED ENTITIES EACH WINDOW.
pull_strength: 0.2

# VERTICAL COMPONENT OF THAT NUDGE.
lift: 0.15

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'BLUE'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'NAUTILUS_SHELL'
gui_custom_model_data: 4144

cast_sound: 'BLOCK_WATER_AMBIENT'