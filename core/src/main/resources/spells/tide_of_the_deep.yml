id: 'tide_of_the_deep'
enabled: true

element: 'WATER'

# WATER OWNS SUSTAIN, DENIAL AND BURST. NEVER TERRAIN - water moves and wears, it never
# reshapes land.
role: 'SUSTAIN'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'LSSSR'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 9
required_focus: 161

# COOLDOWN BEFORE CASTING AGAIN. ZERO, LIKE EVERY OTHER SUSTAINED TOGGLE: THE SECOND CAST
# IS THE ONE THAT TURNS THE TIDE BACK OFF, SO A COOLDOWN WOULD TRAP THE CASTER IN IT.
cooldown: 0

# BASE CAST TIME (SECONDS). SpellBudgets.castTimeRange COLLAPSES CIRCLE 9 TO A SINGLE POINT
# OF 40 TICKS, SO 2.0 IS THE ONLY LEGAL VALUE HERE - THE WITHDRAWN SECTION 6 LADDER COLUMN
# SAID 3.0. THE FRAMEWORK SPENDS THIS BEFORE castAction IS REACHED. TIDE_OF_THE_DEEP
# DECLARES NO CHANNEL AND NO wind_up_duration, SO NOTHING IS ADDED ON TOP OF IT:
# duration_seconds BELOW IS THE TIDE'S LIFE, WHICH STARTS AFTER THE CAST HAS ALREADY
# RESOLVED. THE TWENTY BLEED WINDOWS AND hit_count ARE BUDGETED AGAINST duration_seconds, NOT
# AGAINST THIS KEY, SO NEITHER MOVES.
cast_time: 2.0

# MANA COST
mana_cost: 600

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# DEVIATION FROM SPEC SECTION 6, DOCUMENTED WITH ITS ARITHMETIC. THE SECTION 6 LADDER
# VALUE FOR CIRCLE 9 IS 57.2, BUT A SIXTY-SECOND TOGGLE OPENS TWENTY BLEED WINDOWS, SO:
#     57.2 x 20 = 1144.0 >  280   (THE LADDER VALUE DOES NOT FIT)
#     280 / 20  =  14.0           (THE ONLY PER-WINDOW VALUE THAT DOES)
# 14.0 x 20 = 280.0, EXACTLY THE CIRCLE-9 SUSTAIN BUDGET - THE SAME SHAPE AS
# inferno_pilgrimage's 3 x 16 = 48, A DELIBERATE BUDGET-CHECKED DEPARTURE.
power: 14.0

# A SUSTAIN FIELD DAMAGES A TARGET AT MOST ONCE EVERY damage_interval_ticks, AND hit_count
# EQUALS THE NUMBER OF WINDOWS THAT CADENCE OPENS. 60.0 s AT ONE WINDOW EVERY 60 TICKS
# IS EXACTLY 20 WINDOWS.
#     14.0 x 20 = 280.0  ==  sustainBudget(9)
# TideOfTheDeep.java ENFORCES THIS COUNT RATHER THAN ONLY DOCUMENTING IT, SO RAISING
# duration_seconds IN AN ADMIN'S COPY CANNOT QUIETLY PUSH THE SPELL PAST THE BUDGET.
hit_count: 20
duration_seconds: 60.0

# 3s BETWEEN BLEED WINDOWS, SO 60s DIVIDED BY 3s IS THE 20 IN hit_count.
damage_interval_ticks: 60
# THE CASTER HEALS FROM EVERYTHING CAUGHT, FROM ANYWHERE. THIS KEY REPLACES THE OLD
# "STAND IN THE TIDE" RULE, WHICH WAS THE SPELL'S PRECONDITION.
mend_radius: 8.0
upkeep_mana_per_second: 80  # 80/s: A 60s RUN COSTS 4800 GROSS, 3900 NET OF REGEN.

# RADIUS OF THE TIDE IN BLOCKS.
tide_radius: 8.0

# HOW FAR THE CASTER CAN REACH TO PLACE THE TIDE.
target_range: 20.0

# FRACTION OF THE DAMAGE DEALT IN EACH WINDOW THAT THE CASTER RECEIVES AS HEALTH, CAPPED
# AT MAX HEALTH. THE CASTER IS THE ONLY HEALED ENTITY AND IS HEALED FROM ANYWHERE -
# mend_radius SIZES THE HEALING AURA DRAWN AROUND THEM, THERE IS NO "STAND IN THE TIDE".
heal_ratio: 0.5

# HORIZONTAL VELOCITY NUDGED INTO DROWNED ENTITIES EACH WINDOW, TOWARD THE TIDE'S CENTRE
# SO BODIES CLUMP INSTEAD OF SCATTERING.
pull_strength: 0.2

# VERTICAL COMPONENT OF THAT NUDGE.
lift: 0.15

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'BLUE'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'NAUTILUS_SHELL'
gui_custom_model_data: 4144

cast_sound: 'BLOCK_WATER_AMBIENT'