id: 'light_bolt'
display_name: '&eScroll of the First Ray'
description:
  - '&7A pale bolt of gathered light,'
  - '&7hurled straight down your aim.'
  - '&7It bites the risen dead twice as hard.'
# WHETHER THE PLUGIN SHOULD LOAD THE SPELL. DEFAULT: TRUE
enabled: true

# LIGHT IS THE COUNTER-ELEMENT. EVERY LIGHT SPELL'S DAMAGE IS MULTIPLIED BY THE
# STRONGER OF A FLAT X2.0 AGAINST THE UNDEAD AND UP TO X2.5 ON A TARGET'S
# DARK/LIGHT AFFINITY GAP - BOTH APPLIED AUTOMATICALLY INSIDE AttackSpell.getPower.
# THERE IS NO 'undead_multiplier' KEY BECAUSE THERE IS NO SUCH KEY TO HAVE.
element: 'LIGHT'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'LLLRR'

# BURST SPELLS DEAL A FIXED TOTAL PER CAST AND THEN STOP.
role: 'BURST'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 1
required_focus: 20

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 4

# BASE CAST TIME (SECONDS)
cast_time: 0.5

# MANA COST
mana_cost: 15

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# BASE DAMAGE PER CAST. 3.0 x 1 HIT = 3.0, INSIDE THE CIRCLE-1 BURST BUDGET OF 3.9.
# NO hit_count KEY: THE BOLT ENDS ON ITS FIRST HIT.
power: 3.0

# BLOCKS TRAVELLED PER TICK BEFORE ANY SPELL OPTION OVERRIDES IT
projectile_speed: 0.6

# BLOCKS TRAVELLED BEFORE THE BOLT DISSIPATES
projectile_range: 24.0

# THE DAMAGE SCAN RADIUS AROUND THE BOLT'S POSITION, IN BLOCKS
projectile_hit_radius: 0.6

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'YELLOW'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'GLOWSTONE_DUST'
gui_custom_model_data: 4154

prepare_sound: 'BLOCK_CONDUIT_AMBIENT'
cast_sound: 'ENTITY_FIREWORK_ROCKET_LAUNCH'
