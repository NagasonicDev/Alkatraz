id: 'tidal_reservoir'
# WHETHER THE PLUGIN SHOULD LOAD THE SPELL. DEFAULT: TRUE
enabled: true

# NONE MEANS ITS DAMAGE DOES NOT SCALE WITH ELEMENTAL DAMAGE, ONLY MAGIC DAMAGE
element: 'WATER'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'LRLSL'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 8
required_circle: 8
required_focus: 153

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 85

# BASE CAST TIME (SECONDS)
cast_time: 2.75

# MANA COST
mana_cost: 450

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# FALLBACK DURATION IN SECONDS WHEN THE OPTION FILE IS ABSENT
duration: 90

# HOW WIDE THE CHANNEL IS, IN BLOCKS
width: 6

# THE MOST BLOCKS ONE CHANNEL MAY PLACE
block_budget: 1400

# TERRAIN - the reservoir shapes land but deals no damage, so it carries no power: key.
role: 'TERRAIN'

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'BLUE'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'WATER_BUCKET'
gui_custom_model_data: 4227

prepare_sound: 'BLOCK_WATER_AMBIENT'
prepare_sound_volume: 0.7
prepare_sound_pitch: 1.0
cast_sound: 'ENTITY_PLAYER_SPLASH'
cast_sound_volume: 1.0
cast_sound_pitch: 0.7
