id: 'thousand_waves'
enabled: true

element: 'WATER'

# WATER OWNS SUSTAIN, DENIAL AND BURST. NEVER TERRAIN - water moves and wears.
role: 'BURST'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'LRLSL'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 8
required_focus: 153

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 16

# BASE CAST TIME (SECONDS). SpellBudgets.castTimeRange COLLAPSES CIRCLE 8 TO A SINGLE POINT
# OF 30 TICKS, SO 1.5 IS THE ONLY LEGAL VALUE HERE - THE WITHDRAWN SECTION 6 LADDER COLUMN
# SAID 2.25. THE FRAMEWORK SPENDS THIS BEFORE castAction IS REACHED; THE CHANNEL BELOW IS
# THE SPELL'S OWN AND IS DECLARED SEPARATELY, EXACTLY AS sunfire_barrage, warp AND
# skeletal_knights DO. So the two are NOT derived from one another and shortening this does
# NOT shorten channel_seconds. 2.0s OF CHANNEL IS 40 TICKS, INSIDE circle 8's PAID-OVER
# CEILING OF 2 x windUpTicks(8) = 60, SO THE CHANNEL IS WITHIN CONTRACT RATHER THAN A
# DECLARED PAID-OVER AND NEEDS NO WRITTEN REASON.
cast_time: 1.5

# MANA COST
mana_cost: 450

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# SPEC SECTION 6 LADDER, CIRCLE 8, VERBATIM. NOT DEVIATED. THIS IS THE SCALE BASE FOR
# EVERY CREST - EACH CREST DEALS power x wave_escalation[i], AND power REACHES DAMAGE ON
# ALL EIGHT.
power: 22.7

# A TARGET STANDS IN EXACTLY ONE LANE, AND EXACTLY ONE CREST EVER SWEEPS THAT LANE.
#     lane angle = 2 * atan(4.5 / 14) = 35.638 deg   <   45 deg sector
#     8 sectors x 45 deg = 360 deg, so the fan closes exactly
#     7 ticks x 2.0 blocks/tick = 14.0 = wave_range, so a lane is never empty and never doubled
# => ONE DAMAGE APPLICATION PER TARGET PER CAST, DECLARED AS 22.7 x 1 = 22.7 AGAINST
#    burstBudget(8) = 64.1. A SIX-CREST CORRIDOR WOULD DECLARE hit_count: 6 AND 136.2, TWICE
#    THE BUDGET; THE DISJOINT FAN IS WHAT MAKES 1 THE HONEST NUMBER.
hit_count: 1

# CHANNEL TIME BEFORE THE FAN RELEASES, IN SECONDS. FALLS TO 0.75x (1.5s) AT MAXIMUM
# MASTERY. READ INSIDE THE CLASS AND RUN THROUGH THE SHARED WindUp/ChannelRegistry PAIR,
# EXACTLY AS Warp, SkeletalKnights AND SunfireBarrage DO.
channel_seconds: 2.0

# HOW LONG THE RELEASE RUNS, IN SECONDS. THE LAST CREST IS EMITTED AT TICK 49 AND
# CLEARS ITS LANE BY TICK 56, INSIDE THE 60-TICK LIFE.
duration_seconds: 3.0

# NUMBER OF CRESTS IN THE FAN.
wave_count: 8

# TICKS BETWEEN EMISSIONS.
wave_interval_ticks: 7

# BLOCKS PER TICK. MUST SATISFY wave_interval_ticks x wave_speed == wave_range.
wave_speed: 2.0

# HOW FAR EACH CREST TRAVELS.
wave_range: 14.0

# WIDTH OF EACH LANE IN BLOCKS. AT LONG RANGE THIS IS THE DAMAGE BOUND; CLOSE IN, THE
# NEAREST-LANE RULE IN ThousandWaves.laneOf IS THE STRICTER ONE, BECAUSE A FIXED-WIDTH
# LANE IS ANGULARLY WIDE NEXT TO THE CASTER AND TWO LANES WOULD OTHERWISE BOTH CLAIM
# THE SAME BODY - WHICH WOULD MAKE hit_count: 1 A LIE.
wave_width: 9.0

# DEGREES OF YAW BETWEEN ADJACENT LANES. MUST BE AT LEAST laneAngleDegrees, AND
# wave_count x wave_sector_degrees MUST EQUAL 360.
wave_sector_degrees: 45.0

# ESCALATION. CREST i DEALS power x wave_escalation[i].
#     0.10 + 0.17 + 0.24 + 0.31 + 0.38 + 0.45 + 0.52 + 0.58 = 2.75
#     22.7 x 2.75 = 62.425, INSIDE THE CIRCLE-8 BURST BUDGET OF 64.1
#     worst single target = 22.7 x 0.58 = 13.166
# THE ESCALATION IS BETWEEN LANES, NOT STACKED ON ONE VICTIM.
wave_escalation: [0.10, 0.17, 0.24, 0.31, 0.38, 0.45, 0.52, 0.58]

# HORIZONTAL VELOCITY CARRIED BY A HIT TARGET.
wave_push: 0.55

# VERTICAL COMPONENT OF THAT PUSH.
wave_lift: 0.3

# HOW FAR THE CASTER MAY MOVE DURING THE CHANNEL BEFORE IT BREAKS. READ FROM THIS KEY BY
# WindUp.moveCancelThreshold, WHICH IS WHAT ChannelRegistry CONSULTS ON EVERY MOVE EVENT.
move_cancel_threshold: 0.25

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'WHITE'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'CONDUIT'
gui_custom_model_data: 4143

cast_sound: 'ENTITY_DROWNED_SWIM'