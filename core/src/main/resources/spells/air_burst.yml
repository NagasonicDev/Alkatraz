id: 'air_burst'
display_name: '&7Air Burst'
description:
  - '&7A burst of air that damages and'
  - '&7launches enemies backward.'
# WHETHER THE PLUGIN SHOULD LOAD THE SPELL. DEFAULT: TRUE
enabled: true

# NONE MEANS ITS DAMAGE DOES NOT SCALE WITH ELEMENTAL DAMAGE, ONLY MAGIC DAMAGE
element: 'AIR'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'RRLLS'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 1
required_focus: 20

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 4

# BASE CAST TIME (SECONDS)
cast_time: 0.5

# MANA COST
mana_cost: 15

# BASE DAMAGE PER BLAST POINT. air_burst now deals damage as well as shoving
# targets away from the caster.
power: 3.0

# WHAT THE SPELL IS JUDGED ON. AIR's damage is a by-product of moving something,
# so BURST is its damage role - see spec section 5.2.
role: 'BURST'

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'WHITE'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'FEATHER'
gui_custom_model_data: 4115


