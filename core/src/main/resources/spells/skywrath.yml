id: 'skywrath'
display_name: '&fSkywrath'
description:
  - '&7Take the sky itself. A storm follows you'
  - '&7for fifteen seconds, and you fly with it.'
enabled: true

# WHAT THIS SPELL IS JUDGED ON. READ BY Spell.loadConfiguration AND SpellBudgetTest.
#
# SUSTAIN, NOT UTILITY, despite the flight grant. SpellBudgetTest fails any UTILITY
# spell that carries a power: key, and this spell's 144.0 damage-over-time is the
# number that prices the circle-9 air row. The flight is the delivery mechanism for
# the storm, not a second product - see the spell file.
role: 'SUSTAIN'

# AIR IS FORBIDDEN FROM TERRAIN (spec 5.2). skywrath never calls TerrainEditor and
# never places a block. The storm tracks the caster, so it reads no terrain at all.
element: 'AIR'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'SLRSL'

level: 9

# SPEC SECTION 6 LADDER, CIRCLE 9. mana/cd/focus verbatim - required_focus 161 sits
# under SpellBudgetTest's 85%-of-max_focus ceiling of 0.85 * 190 = 161.5. cast_time
# is NOT the ladder's 3.0s but the only value SpellBudgets.castTimeRange permits at
# circle 9, which collapses to the single point 40 ticks = 2.0s.
required_focus: 161
cooldown: 20
cast_time: 2.0
mana_cost: 600

maximum_mastery: 100

# POWER DEVIATION, DOCUMENTED. The circle-9 ladder power of 28.6 is a PER-HIT value
# and cannot be used unmodified by a SUSTAIN field. 9.6 x hit_count 15 = 144.0,
# which is EXACTLY the circle-9 SUSTAIN budget of 144 - the same landing as
# whirlpool's 22.0 at circle 4 and tornado's 36.0 at circle 5. Same deviation shape
# as inferno_pilgrimage's 16 x 3.
power: 9.6

# MANDATED BY THE SUSTAIN CADENCE RULE AND BY THE T21 BRIEF. The storm damages one
# target once every SpellAttackContext.DAMAGE_INTERVAL_TICKS (20) ticks for
# storm_duration seconds, so it applies damage exactly storm_duration times. 15.0
# seconds is 15 applications. SkywrathConfig.hitsPerTarget() asserts the same number
# and this key must equal it - there is ZERO headroom at circle 9, so no options
# file entry may carry a `damage` stat modifier.
hit_count: 15

# HOW LONG THE STORM LIVES, IN SECONDS. 15.0 -> 300 ticks, 15 damage openings.
storm_duration: 15.0
# THE CADENCE GAP, IN SECONDS. 1.0 -> the mandated 20 ticks. Configurable so the
# number is visible, but 20 is the only legal value at this circle.
strike_interval_seconds: 1.0
# HORIZONTAL RADIUS OF THE STORM COLUMN, IN BLOCKS. The drawn rings sit at
# storm_radius * 1.5 down to storm_radius * 1.4.
storm_radius: 8.0
# HOW FAR ABOVE THE CASTER THE STORM RIDES, IN BLOCKS. Also the height of the
# entity query, so nothing passes the storm unnoticed.
storm_height: 12.0

# --- THE FLIGHT GRANT -------------------------------------------------------
# These three keys grant and revoke creative-style flight for exactly as long as
# the storm lasts. The spell captures allowFlight / flying / flySpeed BEFORE the
# grant and restores all three verbatim on expiry, on death, on quit and on plugin
# disable, so a player is never left permanently airborne.
#
# flight_allow: the master switch. true = fly, false = the storm still runs and
#   still deals 144.0 but the caster stays grounded. Read with a true default, so
#   a missing key grants flight rather than silently denying it.
flight_allow: true
# The fraction of the storm's life the flight lasts. 1.0 means "for exactly the
# storm's duration". The implementation asserts flight_ticks <= storm_ticks at
# launch and clamps down to storm_ticks if a config edit ever breaks that.
flight_ticks_per_storm_tick: 1.0
# Written to Player#setFlySpeed. Valid range is -1.0 .. 1.0; the vanilla creative
# default is 0.05, so 0.15 is a fast but controllable glide.
flight_speed: 0.15

#THE COLOR OF THE SPELL MASTERY BOSSBAR.
mastery_bar_color: 'PURPLE'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'ELYTRA'
gui_custom_model_data: 4153

cast_sound: 'ENTITY_ENDER_DRAGON_GROWL'
cast_sound_volume: 1.0
cast_sound_pitch: 1.0