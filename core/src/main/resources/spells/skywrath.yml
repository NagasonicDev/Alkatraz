id: 'skywrath'
enabled: true

# WHAT THIS SPELL IS JUDGED ON. READ BY Spell.loadConfiguration AND SpellBudgetTest.
#
# The circle-9 AIR capstone is the damage sustain: it calls down a storm that
# batters nearby foes. Flight belongs to the circle-8 Stormcaller utility.
role: 'SUSTAIN'

# AIR IS FORBIDDEN FROM TERRAIN (spec 5.2). skywrath never calls TerrainEditor and
# never places a block. The storm tracks the caster, so it reads no terrain at all.
element: 'AIR'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'SLRSL'

level: 9

# SPEC SECTION 6 LADDER, CIRCLE 9. mana/focus verbatim - required_focus 161 sits
# under SpellBudgetTest's 85%-of-max_focus ceiling of 0.85 * 190 = 161.5. cast_time
# is NOT the ladder's 3.0s but the only value SpellBudgets.castTimeRange permits at
# circle 9, which collapses to the single point 40 ticks = 2.0s. cd IS withdrawn from
# the ladder: this is a sustained toggle, and a cooldown would block the second cast
# that turns the storm off.
required_focus: 161
# A SUSTAINED TOGGLE. CAST IT AGAIN TO END THE STORM.
cooldown: 0
cast_time: 2.0
mana_cost: 600

maximum_mastery: 100

# POWER DEVIATION, DOCUMENTED. The circle-9 ladder power of 28.6 is a PER-HIT value
# and cannot be used unmodified by a SUSTAIN field. 28.0 x hit_count 10 = 280.0,
# which is EXACTLY the circle-9 SUSTAIN budget of 280 - the same landing as
# whirlpool's 22.0 at circle 4 and tornado's 36.0 at circle 5. Same deviation shape
# as inferno_pilgrimage's 16 x 3.
power: 28.0

# MANDATED BY THE SUSTAIN CADENCE RULE. The storm damages one target once every
# strike_interval_seconds for storm_duration seconds, so it applies exactly 10 times:
# 24.0 / 2.4 = 10. SkywrathConfig.hitsPerTarget() asserts the same number; this
# key must equal it. There is ZERO headroom at circle 9, so no options file entry may
# carry a `damage` stat modifier.
hit_count: 10

# HOW LONG THE STORM LIVES, IN SECONDS. 24.0s at a 2.4s cadence -> 10 strikes.
storm_duration: 24.0
# THE CADENCE GAP, IN SECONDS. 2.4 -> 48 ticks between strikes on one target.
strike_interval_seconds: 2.4
# WHAT THE STORM COSTS WHILE IT RUNS, IN MANA PER SECOND. Charged every 20 ticks by
# SustainEffect, and the storm ends the moment the caster cannot pay it.
upkeep_mana_per_second: 70
# HORIZONTAL RADIUS OF THE STORM COLUMN, IN BLOCKS. The drawn rings sit at
# storm_radius * 1.5 down to storm_radius * 1.4.
storm_radius: 8.0
# HOW FAR ABOVE THE CASTER THE STORM RIDES, IN BLOCKS. Also the height of the
# entity query, so nothing passes the storm unnoticed.
storm_height: 12.0

#THE COLOR OF THE SPELL MASTERY BOSSBAR.
mastery_bar_color: 'PURPLE'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'ELYTRA'
gui_custom_model_data: 4153

cast_sound: 'ENTITY_ENDER_DRAGON_GROWL'
cast_sound_volume: 1.0
cast_sound_pitch: 1.0
