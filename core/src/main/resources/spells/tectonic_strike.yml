id: 'tectonic_strike'
enabled: true

# EARTH ACTS ON SPACE. THE DAMAGE HERE IS A CONSEQUENCE OF THE GROUND MOVING.
element: 'EARTH'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'LRRLR'

# EARTH IS FORBIDDEN FROM UTILITY. A FOCUSED SLAM IS A BURST.
# WHAT THIS SPELL IS JUDGED ON. READ BY SpellBudgetTest.
role: 'BURST'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 6
required_focus: 135

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 11

# BASE CAST TIME (SECONDS). AT CIRCLE 6+ THE WIND-UP IS THE CAST TIME AND
# SpellBudgets.castTimeRange(6) IS A SINGLE POINT, 20 TICKS - SO 1.0 IS THE ONLY
# VALUE SpellBudgetsTest.everyShippedSpellCastTimeFallsInsideItsCircleRange WILL
# ACCEPT HERE. THE PLAN'S LADDER COLUMN SAID 1.75; THAT IS NOT LEGAL AT CIRCLE 6.
cast_time: 1.0

# MANA COST
mana_cost: 165

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# SECTION 6 LADDER, CIRCLE 6, VERBATIM. ONE DAMAGE APPLICATION PER TARGET,
# SO hit_count IS ABSENT AND DEFAULTS TO 1. 14.8 <= burstBudget(6) = 34.1.
power: 14.8

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'RED'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'ANVIL'
gui_custom_model_data: 4145

# TICKS OF WARNING RING AND RISING DUST BEFORE THE SLAM LANDS. THE WHOLE
# TELEGRAPH IS PARTICLES ONLY - NO BLOCK IS WRITTEN UNTIL TICK 15.
telegraph_ticks: 15

# RADIUS OF THE TerrainEditor.destroySphere CRATER. A RADIUS-2.5 SPHERE IS 81
# BLOCKS. COMBINED WITH blast_radius THIS IS WHAT MAKES THE DAMAGE A
# CONSEQUENCE OF THE GROUND MOVING RATHER THAN A DIRECT HIT.
crater_radius: 2.5

# HARD maxBlocks CAP ON THAT ONE destroySphere CALL. 120 IS ~1.5x THE 81
# NATURAL CANDIDATES, SO THE DEFAULT NEVER TRUNCATES AND THE PAID 'wide'
# OPTION (179 CANDIDATES) TRUNCATES AT 120 INSTEAD OF OVERRUNNING.
crater_block_cap: 120

# ENTITY SCAN RADIUS AROUND THE EPICENTRE. X, Y AND Z.
blast_radius: 5.5

# HORIZONTAL VELOCITY, RADIALLY OUTWARD FROM THE EPICENTRE.
slam_knockback: 1.6

# ADDED TO slam_knockback SO A TARGET EXACTLY ON THE EPICENTRE STILL LAUNCHES.
slam_lift: 0.9

# MAX DISTANCE FOR Utils.resolveTarget. THE EPICENTRE IS THE BLOCK UNDER THE
# CROSSHAIR, THEN DROPPED TO SOLID GROUND WITH Utils.findTopSolid(..., 6).
slam_reach: 12.0

cast_sound: 'ENTITY_GENERIC_EXPLODE'
cast_sound_volume: 1.4
cast_sound_pitch: 0.5
