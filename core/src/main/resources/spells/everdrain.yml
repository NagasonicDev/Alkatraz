id: 'everdrain'
enabled: true

element: 'WATER'

# WATER OWNS SUSTAIN, DENIAL AND BURST. NEVER TERRAIN - water moves and wears, it never
# reshapes land.
role: 'SUSTAIN'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'LSRSL'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 7
required_focus: 144

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 13

# BASE CAST TIME (SECONDS). SpellBudgets.castTimeRange COLLAPSES CIRCLE 7 TO A SINGLE POINT
# OF 25 TICKS, SO 1.25 IS THE ONLY LEGAL VALUE HERE - THE WITHDRAWN SECTION 6 LADDER COLUMN
# SAID 2.0. THE FRAMEWORK SPENDS THIS BEFORE castAction IS REACHED. EVERDRAIN DECLARES NO
# CHANNEL AND NO wind_up_duration, SO NOTHING IS ADDED ON TOP OF IT: duration_seconds BELOW
# IS THE POOL'S LIFE, WHICH STARTS AFTER THE CAST HAS ALREADY RESOLVED.
cast_time: 1.25

# MANA COST
mana_cost: 240

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# SPEC SECTION 6 LADDER, CIRCLE 7, VERBATIM. NOT DEVIATED: THE BUDGET IS SATISFIED ON
# THE hit_count AXIS INSTEAD, WHICH LEAVES power ON THE LADDER.
power: 18.9

# A SUSTAIN FIELD DAMAGES A TARGET AT MOST ONCE EVERY SpellAttackContext.DAMAGE_INTERVAL_TICKS
# (20 TICKS), AND hit_count EQUALS duration_seconds.
#
# THE BUDGET FIXES BOTH: sustainBudget(7) = 76, AND 76 / 18.9 = 4.02, SO THE POOL
# OPENS EXACTLY FOUR DAMAGE WINDOWS OVER EXACTLY FOUR SECONDS.
#     18.9 x 4 = 75.6  <=  76
# FIVE WINDOWS WOULD BE 94.5 AND WOULD FAIL SpellBudgetTest. Everdrain.java ENFORCES
# THIS COUNT RATHER THAN ONLY DOCUMENTING IT, SO RAISING duration_seconds IN AN ADMIN'S
# COPY CANNOT QUIETLY PUSH THE SPELL PAST THE BUDGET.
hit_count: 4
duration_seconds: 4.0

# RADIUS OF THE POOL IN BLOCKS.
drain_radius: 6.0

# HOW FAR THE CASTER CAN REACH TO PLACE THE POOL.
target_range: 24.0

# HORIZONTAL VELOCITY NUDGED INTO DRAINED ENTITIES EACH WINDOW. A NUDGE, NEVER A
# TELEPORT - NOTHING MOVES, SO THIS IS NOT A BLOCK-ADJACENT EFFECT.
pull_strength: 0.35

# VERTICAL COMPONENT OF THAT NUDGE.
lift: 0.25

# FRACTION OF DAMAGE DEALT THAT THE CASTER RECEIVES AS HEALTH. CAPPED AT MAX HEALTH,
# SO THIS IS A LIFELINE, NOT A HEALTH ENGINE. IT IS ALSO CAPPED AT ONE WINDOW'S WORTH,
# SO WALKING FIVE MOBS INTO THE POOL CANNOT TURN IT INTO A HEALTH ENGINE EITHER.
heal_ratio: 1.0

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'PURPLE'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'PRISMARINE_SHARD'
gui_custom_model_data: 4142

cast_sound: 'BLOCK_WATER_AMBIENT'