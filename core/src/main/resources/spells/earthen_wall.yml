id: 'earthen_wall'
display_name: '&6Earthen Wall'
description:
  - '&7Raises a wall of earth to block'
  - '&7and damage enemies.'
enabled: true
element: 'EARTH'
code: 'LLRSR'
level: 4
required_focus: 90
cooldown: 7
cast_time: 1.25
mana_cost: 75
maximum_mastery: 200

# DAMAGE PER HIT. The wall deals this every time a rising segment reaches a
# target, and the per-cast total is capped at denial_damage_cap below.
power: 0.5

# THE MOST TOTAL DAMAGE ONE WALL MAY DEAL TO A SINGLE TARGET. 0.5/hit x 18 hits
# = 9.0, the total named in the design. It sits under the circle-4 BURST
# ceiling of 13.9, which is what a DENIAL spell's incidental damage is capped at.
denial_damage_cap: 9.0

duration: 10.0
height: 6
length: 20

role: 'DENIAL'
mastery_bar_color: 'GREEN'
gui_item: 'STONE'
gui_custom_model_data: 4121

# SELF-DESTRUCT: Ticks after wall is fully raised before blocks are restored (20 ticks = 1 second)
self_destruct_ticks: 100

cast_sound: 'BLOCK_STONE_BREAK'
cast_sound_volume: 0.6
cast_sound_pitch: 0.5

# WHETHER THIS SPELL CAN DESTROY/modify BLOCKS. DEFAULT: TRUE
block_damage: true

# IF > 0, DESTROYED/MOVED BLOCKS REAPPEAR AFTER THIS MANY SECONDS (FORCED RECOVER). SET TO 0 TO DISABLE.
recover_time: 0
