id: 'atlas_unbound'
# WHETHER THE PLUGIN SHOULD LOAD THE SPELL. DEFAULT: TRUE
enabled: true

# NONE MEANS ITS DAMAGE DOES NOT SCALE WITH ELEMENTAL DAMAGE, ONLY MAGIC DAMAGE
element: 'EARTH'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'LRLLR'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 9
required_circle: 9
required_focus: 161

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 180

# BASE CAST TIME (SECONDS)
cast_time: 3.50

# MANA COST
mana_cost: 600

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# HOW LONG THE RAISED TERRACES STAND, IN SECONDS
duration: 180

# THE MOST BLOCKS ONE RAISE MAY PLACE
block_budget: 6400

# THE BLOCK THE RAISED TERRACES ARE MADE OF
material: 'STONE'

# TERRAIN - the terraces shape land but deal no damage, so it carries no power: key.
role: 'TERRAIN'

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'GREEN'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'GRASS_BLOCK'
gui_custom_model_data: 4229

prepare_sound: 'BLOCK_STONE_PLACE'
prepare_sound_volume: 0.7
prepare_sound_pitch: 0.8
cast_sound: 'ENTITY_IRON_GOLEM_STEP'
cast_sound_volume: 1.0
cast_sound_pitch: 0.6
