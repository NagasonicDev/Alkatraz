id: 'arcane_resonance'
# WHAT THIS SPELL IS JUDGED ON. READ BY Spell.loadConfiguration AND SpellBudgetTest.
# UTILITY IS ONE OF THE TWO ROLES NONE IS ALLOWED (spec 5.2): {UTILITY, DENIAL}.
role: 'UTILITY'
enabled: true

# NONE MEANS ITS DAMAGE DOES NOT SCALE WITH ELEMENTAL DAMAGE, ONLY MAGIC DAMAGE
element: 'NONE'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'SLSLL'

level: 9

# SPEC SECTION 6 LADDER, CIRCLE 9. Verbatim.
# Focus: SpellBudgetTest's 85%-of-max_focus ceiling for circle 9 is
# 0.85 * 190 = 161.5, and the ladder was lowered to 161 so the rule holds.
#
# cast_time 2.0s = 40 ticks. SpellBudgets.castTimeRange collapses circle 9 to the single
# point 40 ticks, so 2.0 is the only legal value; the spec's original single-value ladder
# (3.0) was withdrawn when the range replaced it. inferno_rite at circle 9 takes 2.0s.
required_focus: 161
cast_time: 2.0
mana_cost: 600

# RESONANCE IS A SUSTAINED TOGGLE, NOT A COOLDOWNED ACTION. CAST IT AGAIN TO STOP IT.
cooldown: 0

maximum_mastery: 100

# THIS IS THE SpellRegistryParityTest SENTINEL ID. Three of its methods
# Assumptions.assumeTrue on 'arcane_resonance' being REGISTERED, so this file's id key must
# equal the filename stem exactly - registerIfEnabled keys on it.
#
# THERE IS DELIBERATELY NO power: KEY.
# SpellBudgetTest.utilitySpellsCarryNoDamageKey asserts a UTILITY spell carries no
# power key, and a power key here would be dead config by rule 3 besides - nothing in
# ArcaneResonance reads a power.
#
# THERE IS ALSO DELIBERATELY NO hit_count: KEY, EVEN THOUGH AN AMPLIFIED CAST LANDS
# TWICE. hit_count is "the number of discrete damage applications one cast makes to a
# single target". ArcaneResonance makes ZERO - the two landings are two casts of ANOTHER
# spell, each with its own AttackProperties and its own getPower. Declaring hit_count: 2
# alongside a power key would make SpellBudgetTest compute power x 2 and charge it against
# circle 9's BURST budget of 90.0, attributing another spell's damage to this one.
#
# THE DECLARED PER-CAST DAMAGE TOTAL IS EXACTLY 0.0.

# ---------------------------------------------------------------------------
# ARCANE RESONANCE-SPECIFIC KEYS. All are read by ArcaneResonanceConfig.fromConfig
# with the default shown here, so a missing key is a no-op rather than a zero.
# ---------------------------------------------------------------------------

# MANA DRAINED PER SECOND WHILE IT IS ACTIVE. CIRCLE 9 REGENERATES 15/S, SO A 60S RUN
# COSTS 3300 GROSS AND 2400 NET - ROUGHLY A THIRD OF THE 10,000 POOL.
upkeep_mana_per_second: 55
duration_seconds: 42.0

# THE NEXT N SPELLS FIRE TWICE. CHARGES REFRESH ON EVERY CAST RATHER THAN BEING SPENT,
# SO HOLDING IT CAN NEVER WASTE IT.
charge_count: 4

# MULTIPLY MODIFIER ON THE DAMAGE STAT, APPLIED INSIDE getPower's OWN getModifiedStat CALL.
power_multiplier: 1.25

# TICKS BETWEEN THE FIRST LANDING AND THE DUPLICATE.
duplicate_delay_ticks: 10

# SPELLS THAT ARE NEVER AMPLIFIED AND NEVER BURN A CHARGE WHEN CAST.
#   arcane_resonance - self-amplification would compound without bound, and its own
#                       listener would amplify the amplified casting
#   echo_cast        - its castAction installs its own state and re-fires other spells;
#                       amplifying it would double an already-multiplied rotation
#   warp             - Warp.castAction calls cancelCast(caster) unconditionally
#                       (Warp.java:113) and opens a GUI; firing it twice opens two
#                       menus and poisons the caster's next genuine warp
skip_ids:
  - 'arcane_resonance'
  - 'echo_cast'
  - 'warp'

# NEVER COPIED. A DUPLICATED SUSTAIN WOULD TOGGLE ITSELF STRAIGHT BACK OFF, AND A
# DUPLICATED TERRAIN CAST WOULD SPEND THE BLOCK BUDGET TWICE IN ONE TICK.
duplicate_skip_ids:
  - 'arcane_resonance'
  - 'skywrath'
  - 'tide_of_the_deep'
  - 'crown_of_dawn'
  - 'oblivion'
  - 'worldbreaker'
  - 'inferno_rite'

#THE COLOR OF THE SPELL MASTERY BOSSBAR.
mastery_bar_color: 'PINK'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'RESPAWN_ANCHOR'
gui_custom_model_data: 4165

prepare_sound: 'BLOCK_CONDUIT_ATTACK_TARGET'
prepare_sound_volume: 0.5
prepare_sound_pitch: 0.8
# BLOCK_RESONANCE_CHARGED IS NOT A Bukkit Sound CONSTANT. The spell brief named it, but it does not
# exist in spigot-api 1.19-R0.1, which is what this plugin compiles against (root pom.xml:53) -
# Sound.valueOf would throw on it at runtime and Spell.playSound would swallow it. The conduit's
# "activate" cue is the closest real 1.19 constant for a thing becoming charged; the amethyst
# family (BLOCK_AMETHYST_BLOCK_CHIME) is the thematic alternative if a reviewer prefers it.
cast_sound: 'BLOCK_CONDUIT_ACTIVATE'
cast_sound_volume: 1.0
cast_sound_pitch: 0.6
