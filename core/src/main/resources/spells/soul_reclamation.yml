id: 'soul_reclamation'
# WHETHER THE PLUGIN SHOULD LOAD THE SPELL. DEFAULT: TRUE
enabled: true

# NONE MEANS ITS DAMAGE DOES NOT SCALE WITH ELEMENTAL DAMAGE, ONLY MAGIC DAMAGE
element: 'DARK'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'SLSSS'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 8
required_circle: 8
required_focus: 153

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 120

# BASE CAST TIME (SECONDS)
cast_time: 3.00

# MANA COST
mana_cost: 450

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# HOW FAR FROM THE DEATH SITE THE CASTER'S OWN DROPS ARE PULLED
pull_radius: 10.0

# UTILITY - reclaims the caster's own drops without dealing damage, so it carries no power: key.
role: 'UTILITY'

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'PURPLE'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'SOUL_TORCH'
gui_custom_model_data: 4225

prepare_sound: 'BLOCK_SOUL_SAND_BREAK'
prepare_sound_volume: 0.5
prepare_sound_pitch: 0.7
cast_sound: 'ENTITY_ENDERMAN_TELEPORT'
cast_sound_volume: 0.8
cast_sound_pitch: 0.6
