id: 'worldbreaker'
display_name: '&5Worldbreaker'
description:
  - '&7Tears the arena apart along two faults and levers'
  - '&7the slab between them into the air.'
enabled: true

element: 'EARTH'

# TERRAIN IS IN EARTH'S ALLOWLIST, AND THIS IS THE CIRCLE-9 CEILING.
# WHAT THIS SPELL IS JUDGED ON. READ BY SpellBudgetTest.
role: 'TERRAIN'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'LRLLR'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 9

# SpellBudgets.focusFor(9) IS 161, NOT 162. THE 85% FOCUS CEILING AT CIRCLE 9 IS
# 0.85 x max_focus(9)=190 = 161.5, AND SpellBudgetTest.focusCapsStayAtOrBelow-
# EightyFivePercentOfMaxFocus WOULD FAIL ON 162. THE LADDER VALUE GIVES WAY.
required_focus: 161

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 20

# BASE CAST TIME (SECONDS). AT CIRCLE 6+ THE WIND-UP IS THE CAST TIME AND
# SpellBudgets.castTimeRange(9) IS A SINGLE POINT, 40 TICKS - SO 2.0 IS THE ONLY
# VALUE SpellBudgetsTest WILL ACCEPT HERE. THE PLAN'S LADDER COLUMN SAID 3.0.
cast_time: 2.0

# MANA COST
mana_cost: 600

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# SECTION 6 LADDER, CIRCLE 9, VERBATIM. THE SLAB CRUSHES EVERYTHING ON IT
# EXACTLY ONCE, SO hit_count IS ABSENT AND DEFAULTS TO 1.
# 28.6 <= burstBudget(9) = 90.0.
power: 28.6

# THE CIRCLE-9 TERRAIN CEILING AND THE LARGEST ALLOWANCE IN THE ROSTER. THIS IS
# NOT A DEVIATION - IT IS SpellBudgets.terrainBudget(9) VERBATIM.
# THE VALUE IS ALSO THE ONE SHARED int[] ALLOWANCE: BOTH FAULTS AND THE SLAB
# DECREMENT THE SAME COUNTER, SO THE SUM CANNOT EXCEED IT.
# 15 SITES x 33 x 2 FAULTS = 990 DESTROYED, PLUS 10 x 30 x 3 = 900 PLACED.
terrain_budget: 2000

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'PURPLE'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'BEDROCK'
gui_custom_model_data: 4148

# TICKS OF GROWING FAULT LINES BEFORE ANYTHING MOVES. PARTICLES AND SOUND ONLY.
telegraph_ticks: 20

# CENTRE-TO-CENTRE DISTANCE BETWEEN THE TWO FAULTS, MEASURED ACROSS THE
# CASTER'S FACING. EACH SITS AT +/- rift_spacing / 2 FROM THE CENTRE.
rift_spacing: 14.0

# HOW FAR EACH FAULT RUNS ALONG THE CASTER'S FACING, AND HOW MANY BLOCKS BOTH
# FAULTS ADVANCE PER DIG TICK. 30 / 2 = 15 DIG TICKS.
rift_length: 30
rift_step: 2

# RADIUS OF THE destroySphere HAMMERED IN AT EACH DIG SITE. A RADIUS-2 SPHERE
# IS 33 CANDIDATE BLOCKS, SO ONE FAULT DIGS 15 x 33 = 495 AND BOTH DIG 990.
# THESE BLOCKS ARE NOT RESTORED - breakNaturally HAS ALREADY PAID THEM OUT AS
# DROPS, AND RESTORING THEM WOULD DUPLICATE THE MATERIAL.
rift_radius: 2.0

# WIDTH OF THE SLAB BETWEEN THE FAULTS AT ITS WIDEST, AND HOW FAR IT IS
# LEVERED UP. 10 x 30 = 300 COLUMNS x 3 LAYERS = 900 PLACED, ALL RECORDED AND
# ALL RESTORED BY ONE TerrainEditor.restoreAll.
crush_width: 10
crush_lift: 3

# UPWARD VELOCITY GIVEN TO ANYTHING RIDING THE RISING SLAB.
crush_lift_velocity: 1.8

# HOW LONG THE RAISED SLAB STANDS BEFORE IT SETTLES BACK. THE FAULTS STAY.
rift_hold_seconds: 6.0

cast_sound: 'ENTITY_ENDER_DRAGON_GROWL'
cast_sound_volume: 1.2
cast_sound_pitch: 0.6
