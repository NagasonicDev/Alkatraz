id: 'worldbreaker'
enabled: true

element: 'EARTH'

# TERRAIN IS IN EARTH'S ALLOWLIST, AND THIS IS THE CIRCLE-9 CEILING.
# WHAT THIS SPELL IS JUDGED ON. READ BY SpellBudgetTest.
role: 'TERRAIN'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'LRLLR'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 9

# SpellBudgets.focusFor(9) IS 161, NOT 162. THE 85% FOCUS CEILING AT CIRCLE 9 IS
# 0.85 x max_focus(9)=190 = 161.5, AND SpellBudgetTest.focusCapsStayAtOrBelow-
# EightyFivePercentOfMaxFocus WOULD FAIL ON 162. THE LADDER VALUE GIVES WAY.
required_focus: 161

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 20

# BASE CAST TIME (SECONDS). AT CIRCLE 6+ THE WIND-UP IS THE CAST TIME AND
# SpellBudgets.castTimeRange(9) IS A SINGLE POINT, 40 TICKS - SO 2.0 IS THE ONLY
# VALUE SpellBudgetsTest WILL ACCEPT HERE. THE PLAN'S LADDER COLUMN SAID 3.0.
cast_time: 2.0

# MANA COST
mana_cost: 600

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# SECTION 6 LADDER, CIRCLE 9, VERBATIM. THE SLAB CRUSHES EVERYTHING ON IT ON
# EACH OF crush_events SEPARATE TICKS, SO hit_count IS ABSENT AND DEFAULTS TO 1.
# 57.2 x 3 = 171.6 <= burstBudget(9).
power: 57.2

# THE CIRCLE-9 TERRAIN CEILING AND THE LARGEST ALLOWANCE IN THE ROSTER. THIS IS
# NOT A DEVIATION - IT IS SpellBudgets.terrainBudget(9) VERBATIM.
# THE VALUE IS ALSO THE ONE SHARED int[] ALLOWANCE: BOTH FAULTS, THE SLAB AND
# THE COLLAPSE DECREMENT THE SAME COUNTER, SO THE SUM CANNOT EXCEED IT.
# AT THE SHIPPED DEFAULTS THE LAYOUT FITS: 19 DIG TICKS x 57 x 2 FAULTS = 2166
# DESTROYED, PLUS 350 PLACED PER LAYER x 3 = 1050, PLUS 123 x 2 = 246 FOR BOTH
# FULL CHASM SPHERES. TOTAL 3462, INSIDE THE 3600 BUDGET.
terrain_budget: 3600

# HOW MANY TIMES A SINGLE TARGET IS CRUSHED. ONE ctx.power PER TARGET PER EVENT:
# THE LIFT, THE FALL WHEN THE HOLD ENDS, AND THE SLAB DROPPING INTO THE CHASM.
crush_events: 3

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'PURPLE'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'BEDROCK'
gui_custom_model_data: 4148

# TICKS OF GROWING FAULT LINES BEFORE ANYTHING MOVES. PARTICLES AND SOUND ONLY.
telegraph_ticks: 20

# CENTRE-TO-CENTRE DISTANCE BETWEEN THE TWO FAULTS, MEASURED ACROSS THE
# CASTER'S FACING. EACH SITS AT +/- rift_spacing / 2 FROM THE CENTRE.
rift_spacing: 14.0

# HOW FAR EACH FAULT RUNS ALONG THE CASTER'S FACING, AND HOW MANY BLOCKS BOTH
# FAULTS ADVANCE PER DIG TICK. 38 / 2 = 19 DIG TICKS.
rift_length: 38
rift_step: 2

# RADIUS OF THE destroySphere HAMMERED IN AT EACH DIG SITE. A RADIUS-2.4 SPHERE
# IS 57 CANDIDATE BLOCKS, SO ONE FAULT DIGS 19 x 57 = 1083 AND BOTH DIG 2166.
# THESE BLOCKS ARE NOT RESTORED - breakNaturally HAS ALREADY PAID THEM OUT AS
# DROPS, AND RESTORING THEM WOULD DUPLICATE THE MATERIAL.
# HALF OF rift_spacing IS 7, WHICH IS FAR OUTSIDE 2.4, SO THE TWO FAULTS NEVER
# TOUCH EACH OTHER.
rift_radius: 2.4

# TICKS AFTER THE LIFT BEFORE THE FAULTS COLLAPSE INTO A CHASM, AND THE RADIUS
# OF THE destroySphere HAMMERED IN AT EACH RIFT CENTRE WHEN THEY DO.
collapse_ticks: 200
chasm_radius: 3.0

# WIDTH OF THE SLAB BETWEEN THE FAULTS AT ITS WIDEST, AND HOW FAR IT IS
# LEVERED UP. THE FOOTPRINT LOOPS BOTH AXES INCLUSIVE, SO ONE LAYER IS
# (2 x (38 / 2) + 1) x (2 x (8 / 2) + 1) = 39 x 9 = 351 COLUMNS, MINUS THE
# ONE COLUMN THE CASTER IS STANDING ON = 350. x 3 LAYERS = 1050 PLACED, ALL
# RECORDED AND ALL RESTORED BY ONE TerrainEditor.restoreAll AFTER THE COLLAPSE.
# 8 x 38 = 304 IS NOT THE COLUMN COUNT: IT IS WHAT THE RECTANGLE WOULD BE IF
# NEITHER AXES NOR THE CASTER'S OWN COLUMN WERE HANDLED.
crush_width: 8
crush_lift: 3

# UPWARD VELOCITY GIVEN TO ANYTHING RIDING THE RISING SLAB.
crush_lift_velocity: 1.8

# HOW LONG THE RAISED SLAB STANDS BEFORE IT SETTLES BACK. THE FAULTS STAY, AND
# THE COLLAPSE ABOVE IS WHAT TURNS THEM INTO A CHASM.
rift_hold_seconds: 6.0

cast_sound: 'ENTITY_ENDER_DRAGON_GROWL'
cast_sound_volume: 1.2
cast_sound_pitch: 0.6
