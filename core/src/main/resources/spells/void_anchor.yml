id: 'void_anchor'
# WHETHER THE PLUGIN SHOULD LOAD THE SPELL. DEFAULT: TRUE
enabled: true

# ELEMENT TYPE
element: 'DARK'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'SLSSS'

# UTILITY IS JUDGED ON NOTHING, SO IT CARRIES NO power: KEY.
# SpellBudgetTest.utilitySpellsCarryNoDamageKey ASSERTS THAT. THE HORROR'S DAMAGE IS
# horror_power, WRITTEN INTO Attribute.GENERIC_ATTACK_DAMAGE BY THE MOB'S OWN BRAIN.
role: 'UTILITY'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 8
required_focus: 153

# COOLDOWN BEFORE CASTING AGAIN (SECONDS)
cooldown: 16

# BASE CAST TIME (SECONDS). SpellBudgets.castTimeRange(8) COLLAPSES TO THE SINGLE POINT
# 30 TICKS, SO 1.5 IS THE ONLY LEGAL CIRCLE-8 CAST TIME - NOT THE 2.25 OF THE OLD
# SECTION 6 SINGLE-VALUE LADDER, WHICH CAST TIME AS A RANGE RETIRED.
cast_time: 1.5

# MANA COST
mana_cost: 450

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# THE CHANNEL. 1.5 SECONDS x 20 = 30 TICKS, STATED EXPLICITLY SO THE CHANNEL IS
# READABLE FROM THE YML AND NEVER SILENTLY DRIFTS FROM cast_time. MOVING, BEING HIT,
# QUITTING OR PLUGIN SHUTDOWN BREAKS IT - ChannelRegistry owns that quadruple.
channel_ticks: 30

# HOW FAR THE ANCHOR MAY BE PLACED, IN BLOCKS, AND HOW FAR A CHANNELLING CASTER MAY
# STRAY FROM IT BEFORE THE CHANNEL BREAKS. READ BY WindUp.moveCancelThreshold.
move_cancel_threshold: 0.25
anchor_range: 24

# THE BOUND HORROR. horror_power IS A MOB ATTRIBUTE, NOT A SPELL DAMAGE LINE: IT IS
# WRITTEN INTO GENERIC_ATTACK_DAMAGE AND SPENT BY THE BRAIN'S melee_attack GOAL ON
# VANILLA COOLDOWNS. THE PRECEDENT CHAIN IS summon_zombies.zombie_power 2.0 (CIRCLE 4,
# THREE MINIONS) -> skeletal_knights.knight_power 6.0 (CIRCLE 6, THREE KNIGHTS) ->
# 10.0 (CIRCLE 8, ONE HORROR). FEWER SERVANTS, EACH FAR STRONGER.
horror_count: 1
horror_duration: 30
horror_health: 30.0
horror_power: 10.0

# HOW FAR THE HORROR MAY BE DRAGGED FROM ITS ANCHOR BEFORE IT IS TELEPORTED BACK.
# TOGETHER WITH GENERIC_KNOCKBACK_RESISTANCE 1.0 THIS IS WHAT MAKES IT BOUND.
anchor_leash: 4.0
horror_spawn_radius: 2.0

# THE LASH - IT HOLDS, IT DOES NOT DAMAGE. THE HORROR'S OWN STEEL DOES THE KILLING.
# lash_interval_ticks 20 IS ONE LASH PER SECOND, WHICH IS WHY THIS IS A UTILITY SPELL
# AND NOT A SUSTAIN: THERE IS NO DAMAGE CADENCE TO BUDGET AT ALL.
lash_range: 6.0
lash_interval_ticks: 20
lash_hold_ticks: 10
anchor_pull_strength: 0.45

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'GREEN'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'RESPAWN_ANCHOR'
gui_custom_model_data: 4160

prepare_sound: 'BLOCK_BEACON_ACTIVATE'
prepare_sound_volume: 0.3
prepare_sound_pitch: 0.6
cast_sound: 'ENTITY_WITHER_SPAWN'
cast_sound_volume: 0.8
cast_sound_pitch: 1.6