id: 'stormcaller'
enabled: true

# WHAT THIS SPELL IS JUDGED ON. READ BY Spell.loadConfiguration AND SpellBudgetTest.
role: 'SUSTAIN'

# AIR IS FORBIDDEN FROM TERRAIN (spec 5.2). stormcaller never calls TerrainEditor
# and never places a block. The storm tracks the caster, so it reads no terrain
# at all - there is nowhere for it to be placed.
element: 'AIR'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'RSSLS'

level: 8

# SPEC SECTION 6 LADDER, CIRCLE 8. mana/cd/focus verbatim - required_focus 153 is
# exactly SpellBudgetTest's 85% ceiling of 0.85 * 180. cast_time is NOT the
# ladder's 2.25s but the only value SpellBudgets.castTimeRange permits at circle 8,
# which collapses to the single point 30 ticks = 1.5s.
required_focus: 153
cooldown: 16
cast_time: 1.5
mana_cost: 450

maximum_mastery: 100

# POWER DEVIATION, DOCUMENTED. The circle-8 ladder power of 22.7 is a PER-HIT value
# and cannot be used unmodified by a SUSTAIN field. 8.0 x hit_count 12 = 96.0
# against a sustainBudget(8) of 102, leaving 6.0 of headroom. Same deviation shape
# as inferno_pilgrimage's 16 x 3.
power: 8.0

# MANDATED BY THE SUSTAIN CADENCE RULE. The storm damages one target once every
# SpellAttackContext.DAMAGE_INTERVAL_TICKS (20) ticks for storm_duration seconds,
# so it applies damage exactly storm_duration times. This must equal
# storm_duration, and StormcallerConfig.hitsPerTarget() asserts the same number.
hit_count: 12

# HOW LONG THE CHANNEL HOLDS THE CASTER STILL BEFORE THE STORM FORMS, IN SECONDS.
# 2.25 -> 45 ticks, or 34 at max mastery - the same 0.75x discount
# WarpConfig.windUpTicks applies. Moving more than move_cancel_threshold blocks,
# or taking any damage, aborts it. Read by the shared WindUp/ChannelRegistry pair,
# which is also what Warp and SkeletalKnights use.
channel_duration: 2.25
# MOVING FURTHER THAN THIS MANY BLOCKS DURING THE CHANNEL ABORTS IT.
move_cancel_threshold: 0.30

# HOW LONG THE STORM LIVES, IN SECONDS. 12.0 -> 240 ticks, 12 damage openings.
storm_duration: 12.0
# THE CADENCE GAP, IN SECONDS. 1.0 -> the mandated 20 ticks. It is configurable so
# the number is visible in the yml, but 20 is the only legal value at this circle
# and StormcallerConfig.strikeIntervalTicks() is what the test asserts.
strike_interval_seconds: 1.0
# HORIZONTAL RADIUS OF THE STORM COLUMN, IN BLOCKS. The drawn rings sit at
# storm_radius * 1.4 down to storm_radius * 1.1.
storm_radius: 6.0
# HOW FAR ABOVE THE CASTER THE STORM RIDES, IN BLOCKS. This is also the height of
# the entity query, so nothing can stand above or below the storm unnoticed.
storm_height: 9.0

#THE COLOR OF THE SPELL MASTERY BOSSBAR.
mastery_bar_color: 'BLUE'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'BLAZE_POWDER'
gui_custom_model_data: 4152

cast_sound: 'ENTITY_WITHER_AMBIENT'
cast_sound_volume: 0.8
cast_sound_pitch: 0.9