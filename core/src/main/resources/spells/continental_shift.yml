id: 'continental_shift'
enabled: true

element: 'EARTH'

# TERRAIN IS IN EARTH'S ALLOWLIST, AND THIS SPELL IS JUDGED ON BLOCKS.
# WHAT THIS SPELL IS JUDGED ON. READ BY SpellBudgetTest.
role: 'TERRAIN'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'SSLSL'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 8
required_focus: 153

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 16

# BASE CAST TIME (SECONDS). AT CIRCLE 6+ THE WIND-UP IS THE CAST TIME AND
# SpellBudgets.castTimeRange(8) IS A SINGLE POINT, 30 TICKS - SO 1.5 IS THE ONLY
# VALUE SpellBudgetsTest WILL ACCEPT HERE. THE PLAN'S LADDER COLUMN SAID 2.25.
cast_time: 1.5

# MANA COST
mana_cost: 450

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# SECTION 6 LADDER, CIRCLE 8, VERBATIM. THIS SPELL DEALS NO DAMAGE, SO NO
# getPower CALL SITE EXISTS AND NO hit_count IS DECLARED - THE KEY IS HERE SO
# singlePowerKeyNeverExceedsItsCircleBurstBudget HAS A NUMBER TO READ, AND
# 22.7 IS WELL UNDER burstBudget(8) = 64.1. DEAD CONFIG IS PREFERABLE TO A
# DAMAGE CALL THAT WOULD BREAK THE TERRAIN BUDGET.
power: 22.7

# BLOCKS THIS CAST MAY PLACE, SUMMED ACROSS ALL SIX LAYERS AND CHECKED BEFORE
# EVERY WRITE VIA A SHARED int[]. 73 COLUMNS x 6 LAYERS = 438 AT DEFAULTS;
# 163 x 9 = 1467 FOR THE 'colossus' OPTION, WHICH IS OVER THIS CEILING AND
# IS THEREFORE TRUNCATED RATHER THAN OVERRUNNING.
terrain_budget: 1400

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'GREEN'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'SANDSTONE'
gui_custom_model_data: 4147

# SECONDS THE CHANNEL RUNS. AT 3.0s AND plateau_height 6 THAT IS ONE LAYER
# EVERY 10 TICKS, SO THE PLATEAU RISES WITH THE CHANNEL. MAX MASTERY CUTS IT
# TO 75 PERCENT, THE SAME SHAPE AS WindUp.effectiveTicks.
channel_seconds: 3.0

# BLOCKS OF MOVEMENT THAT BREAK THE CHANNEL. ALSO BREAKS ON ANY DAMAGE,
# ON QUIT, ON DEATH, AND ON PLUGIN DISABLE.
move_cancel_threshold: 0.35

# MAX DISTANCE FOR Utils.resolveTarget. THE PLATEAU CENTRE IS THE BLOCK UNDER
# THE CROSSHAIR, THEN DROPPED TO SOLID GROUND.
plateau_reach: 20.0

# HALF-EXTENTS OF THE FOOTPRINT, IN THE CASTER'S YAW FRAME. A FILLED ELLIPSE:
# FOR EACH dz, HALF-WIDTH = floor(radius_x * sqrt(1 - (dz/radius_z)^2)).
# 6 x 4 IS 73 COLUMNS, SO 73 x 6 LAYERS = 438 BLOCKS.
plateau_radius_x: 6.0
plateau_radius_z: 4.0

# LAYERS OF STONE STACKED ABOVE THE ORIGINAL SURFACE. THE ORIGINAL SURFACE IS
# UNTOUCHED - THIS SPELL PLACES AND RESTORES, AND NEVER DESTROYS, BECAUSE
# TerrainEditor.destroySphere PAYS OUT REAL DROPS AND RESTORING THOSE BLOCKS
# WOULD DUPLICATE THE MATERIAL.
plateau_height: 6

# RESOLVED WITH Material.matchMaterial AND FALLING BACK TO POLISHED_ANDESITE
# IF THE NAME DOES NOT RESOLVE.
plateau_material: 'POLISHED_ANDESITE'

# HOW LONG THE PLATEAU STANDS BEFORE IT COLLAPSES INTO THE CRUST.
plateau_hold_seconds: 8.0

# TICKS THE COSMETIC COLLAPSE DUST CURTAIN TAKES. THE ACTUAL RESTORE IS ONE
# TerrainEditor.restoreAll CALL, SCHEDULED INDEPENDENTLY OF THIS ANIMATION SO
# THE TWO CANNOT DESYNCHRONISE.
collapse_ticks: 12

cast_sound: 'BLOCK_ANVIL_USE'
cast_sound_volume: 1.0
cast_sound_pitch: 0.5
