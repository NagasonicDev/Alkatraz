# =============================================================================
# stormcaller_options.yml
# Spell option configuration for the Stormcaller spell.
#
# Structure overview:
#   options:
#     <option-id>:
#       description:   <string>
#       icon:          <Material name>
#       default_index: <int>   # 0-based index into 'values' list order
#       values:
#         <value-id>:
#           display_name: <string>
#           description:  <string>
#           icon:         <Material name>
#           value_type:   int | double | float | boolean | string | auto
#           value:        <typed value>
#           requirements: [...]   # optional
#           impacts:      [...]   # optional
#
# The `swift` channel value is STRICTLY BETTER than the default - 1.5 s of
# commitment instead of 2.25 - so per spec 4.3 it carries a mana_cost impact of
# its own (+60). `steady` matches the yml's channel_duration exactly, so a player
# who never opens the menu casts exactly what the yml describes. Nothing here
# changes `damage`, so no option can take the spell past its SUSTAIN budget.
# =============================================================================

options:

  # ---------------------------------------------------------------------------
  # channel - how long the caster must hold still
  # ---------------------------------------------------------------------------
  channel:
    description: "How long the channel holds you still"
    icon: CLOCK
    default_index: 1

    values:

      swift:
        display_name: "Swift Channel"
        description: "Converge in 1.5s instead of 2.25s. Costs extra mana."
        icon: SUGAR
        value_type: double
        value: 1.5
        requirements:
          - type: number_stat
            stat: circleLevel
            minimum: 8
            description: "Requires Circle Level 8"
          - type: number_stat
            stat: mastery_stormcaller
            minimum: 75
            description: "Requires 75 Stormcaller mastery"
        impacts:
          - type: stat_modifier
            stat: channel_duration
            value: 1.5
            modifier: SET
          - type: mana_cost
            change: 60

      steady:
        display_name: "Steady Channel"
        description: "Converge in 2.25s. The default."
        icon: CLOCK
        value_type: double
        value: 2.25
        impacts:
          - type: stat_modifier
            stat: channel_duration
            value: 2.25
            modifier: SET