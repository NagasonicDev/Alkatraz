# Spell options for Stormcaller's flight utility.
options:
  flight_speed:
    description: "How quickly the storm carries you"
    icon: FEATHER
    default_index: 0
    values:
      measured:
        display_name: "Measured Lift"
        description: "A steady, controlled ascent and glide."
        icon: FEATHER
        value_type: double
        value: 0.15
        impacts:
          - type: stat_modifier
            stat: flight_speed
            value: 0.15
            modifier: SET
      swift:
        display_name: "Swift Lift"
        description: "Fly faster. Costs extra mana."
        icon: ELYTRA
        value_type: double
        value: 0.20
        requirements:
          - type: number_stat
            stat: circleLevel
            minimum: 8
            description: "Requires Circle Level 8"
          - type: number_stat
            stat: mastery_stormcaller
            minimum: 75
            description: "Requires 75 Stormcaller mastery"
        impacts:
          - type: stat_modifier
            stat: flight_speed
            value: 0.20
            modifier: SET
          - type: mana_cost
            change: 60
