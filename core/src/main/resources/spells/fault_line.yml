id: 'fault_line'
display_name: '&4Fault Line'
description:
  - '&7Splits the ground open and keeps splitting it for ten'
  - '&7seconds, hurling anything that falls into the crack.'
enabled: true

element: 'EARTH'

# A SUSTAIN FIELD IS OUTSIDE EARTH'S {TERRAIN, DENIAL, BURST} ALLOWLIST. THIS IS
# THE DOCUMENTED SPEC-SECTION-9 DEVIATION AND IT IS WHY THE BUDGET TEST READS
# THREE KEYS: power, hit_count AND terrain_budget.
# WHAT THIS SPELL IS JUDGED ON. READ BY SpellBudgetTest.
role: 'SUSTAIN'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'LLSLR'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 7
required_focus: 144

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 13

# BASE CAST TIME (SECONDS). AT CIRCLE 6+ THE WIND-UP IS THE CAST TIME AND
# SpellBudgets.castTimeRange(7) IS A SINGLE POINT, 25 TICKS - SO 1.25 IS THE ONLY
# VALUE SpellBudgetsTest WILL ACCEPT HERE. THE PLAN'S LADDER COLUMN SAID 2.0.
cast_time: 1.25

# MANA COST
mana_cost: 240

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# SPEC SECTION 9, fault_line. NOT THE 18.9 LADDER VALUE: A SUSTAIN FIELD SPENDS
# ITS BUDGET ACROSS MANY APPLICATIONS, SO THE NUMBER IS THE BUDGET DIVIDED BY
# THE LIFE. 7.6 x 10 = 76.0, EXACTLY THE CIRCLE-7 SUSTAIN BUDGET.
power: 7.6

# ONE HIT PER DAMAGE_INTERVAL_TICKS (20 TICKS = 1 SECOND) OVER THE DEFAULT
# 10 SECOND LIFE, SO 10 APPLICATIONS IN TOTAL.
hit_count: 10

# THE CRACK KEEPS SPLITTING GROUND FOR ITS WHOLE LIFE, AND THAT TERRAIN IS CHARGED
# AGAINST THE TERRAIN BUDGET SEPARATELY FROM THE SUSTAIN ONE ABOVE.
# 10 TICKS x (33 DESTROYED + 4 PLACED) = 370 AT DEFAULTS; 555 ON THE 'rift'
# OPTION. BOTH UNDER 950. THIS NUMBER IS ALSO THE HARD int[] ALLOWANCE, SO
# THERE IS NO SECOND CAP KEY.
terrain_budget: 950

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'YELLOW'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'CRACKED_STONE_BRICKS'
gui_custom_model_data: 4146

# SECONDS THE FAULT STAYS OPEN. hit_count == duration_seconds BECAUSE THE CADENCE
# IS ONE APPLICATION PER SECOND.
duration: 10

# BLOCKS IN FRONT OF THE CASTER WHERE THE FAULT BEGINS.
crack_origin_reach: 4.0

# TOTAL BLOCKS THE FAULT RUNS, AND HOW MANY IT ADVANCES PER DAMAGE TICK.
# 40 / 4 = 10 TICKS, WHICH IS EXACTLY hit_count.
crack_length: 40
crack_step: 4

# RADIUS OF THE destroySphere HAMMERED INTO THE GROUND AT EACH TICK. A RADIUS-2
# SPHERE IS 33 CANDIDATE BLOCKS.
crack_radius: 2.0

# LIP BLOCKS PER SIDE. 2 SIDES x crack_width x 1 HIGH = 4 PLACED PER TICK.
# EVERY ONE IS RECORDED AND RESTORED THROUGH TerrainEditor.restoreAll.
crack_width: 2

# VERTICAL IMPULSE ON ANYTHING THE TRENCH TOUCHES ON A DAMAGE TICK.
crack_lift: 1.35

# ENTITY SCAN RADIUS AROUND THE DIG CENTRE, X AND Z. Y IS FIXED AT 3.0.
crack_damage_radius: 3.5

# MATERIAL OF THE RAISED LIP. RESOLVED WITH Material.matchMaterial AND FALLING
# BACK TO POLISHED_ANDESITE IF THE NAME DOES NOT RESOLVE.
lip_material: 'POLISHED_ANDESITE'

cast_sound: 'BLOCK_GRINDSTONE_USE'
cast_sound_volume: 1.0
cast_sound_pitch: 0.6
