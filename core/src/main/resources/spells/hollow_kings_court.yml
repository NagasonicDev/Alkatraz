id: 'hollow_kings_court'
# WHETHER THE PLUGIN SHOULD LOAD THE SPELL. DEFAULT: TRUE
enabled: true

# NONE MEANS ITS DAMAGE DOES NOT SCALE WITH ELEMENTAL DAMAGE, ONLY MAGIC DAMAGE
element: 'DARK'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'RSLRL'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 9
required_circle: 9
required_focus: 161

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 150

# BASE CAST TIME (SECONDS)
cast_time: 3.50

# MANA COST
mana_cost: 600

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# RADIUS OF THE SHADOW DOMAIN
radius: 18

# HOW MANY SPECTRAL KNIGHTS RISE
knights: 4

# HOW LONG THE COURT HOLDS
duration: 30

# DAMAGE EACH KNIGHT DEALS PER STRIKE
strike_damage: 5.0

# SUSTAIN - the court remains until the domain expires
role: 'SUSTAIN'

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'PURPLE'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'WITHER_ROSE'
gui_custom_model_data: 4232

cast_sound: 'ENTITY_WITHER_SPAWN'
cast_sound_pitch: 1.4
