# =============================================================================
# worldbreaker_options.yml
# Spell option configuration for the Worldbreaker spell.
#
# BOTH FAULTS AND THE SLAB DECREMENT **ONE** SHARED int[] ALLOWANCE, which starts
# at terrain_budget = 3600 and is never topped up. Two counters would each be
# able to spend 3600; one counter makes destroyed + placed <= 3600 structural.
# Neither option changes how many TIMES a target is crushed: the slab takes
# crush_events = 3 swings, so power 57.2 x 3 = 171.6 is what a cast lands,
# inside burstBudget(9) = 180.0. NO OPTION TOUCHES DAMAGE - ctx.power() is read
# once per swing, so any multiplier here would apply three times and immediately
# bust that ceiling. Each option's cost is paid in BLOCKS instead.
# =============================================================================

options:

  # ---------------------------------------------------------------------------
  # rift_length - how far the faults run
  # ---------------------------------------------------------------------------
  rift_length:
    description: "How far the faults tear across the arena"
    icon: DEEPSLATE
    default_index: 1

    values:

      hairline:
        display_name: "Hairline"
        description: "Short faults. 20 blocks, 10 dig ticks. 1140 dug, 690 raised, 246 for the chasms - 2076 of 3600."
        icon: CRACKED_DEEPSLATE_TILES
        value_type: int
        value: 20
        requirements:
          - type: number_stat
            stat: circleLevel
            minimum: 9
            description: "Requires Circle Level 9"
        impacts:
          - type: stat_modifier
            stat: rift_length
            value: 20
            modifier: SET

      standard:
        display_name: "Fracture"
        description: "38 block faults. 2166 dug, 1284 raised, 246 wanted for the chasms - 3696 wanted, clipped to 3600."
        icon: DEEPSLATE_BRICKS
        value_type: int
        value: 38
        impacts:
          - type: stat_modifier
            stat: rift_length
            value: 38
            modifier: SET

      world_end:
        display_name: "World End"
        description: "44 block faults. 2508 dug, 1482 raised, 246 wanted for the chasms - 4236 wanted, clipped to 3600."
        icon: BLACKSTONE
        value_type: int
        value: 44
        requirements:
          - type: number_stat
            stat: circleLevel
            minimum: 9
            description: "Requires Circle Level 9"
          - type: number_stat
            stat: mastery_worldbreaker
            minimum: 100
            description: "Requires 100 Worldbreaker mastery"
        impacts:
          - type: stat_modifier
            stat: rift_length
            value: 44
            modifier: SET
          # 22 DIG TICKS x 57 x 2 FAULTS = 2508 DUG, PLUS 45 x 11 - 1 = 494
          # PER LAYER x 3 = 1482 RAISED, PLUS 123 x 2 = 246 FOR THE CHASMS, IS
          # 4236 BLOCKS OVER THE 3600 CEILING. THIS MAX OPTION THEREFORE PAYS
          # EXTRA MANA. THE SHARED int[] STILL TRUNCATES THE WRITE AT 3600 -
          # THE OPTION BUYS A BIGGER JOB, NOT A BIGGER ALLOWANCE.
          - type: mana_cost
            change: 150

  # ---------------------------------------------------------------------------
  # crush_lift - how high the trapped slab is levered up
  # ---------------------------------------------------------------------------
  crush_lift:
    description: "How high the trapped slab is levered up"
    icon: POLISHED_BLACKSTONE
    default_index: 1

    values:

      heave:
        display_name: "Heave"
        description: "One block up. 428 raised - a third of Lever's pin. 2840 of 3600 with the chasms."
        icon: BLACK_CONCRETE
        value_type: int
        value: 1
        requirements:
          - type: number_stat
            stat: circleLevel
            minimum: 9
            description: "Requires Circle Level 9"
        impacts:
          - type: stat_modifier
            stat: crush_lift
            value: 1
            modifier: SET

      standard:
        display_name: "Lever"
        description: "Three blocks up. 428 a layer x 3 = 1284 raised. Dig and slab alone want 3450, so the chasms get 150 of their 246."
        icon: POLISHED_BLACKSTONE
        value_type: int
        value: 3
        impacts:
          - type: stat_modifier
            stat: crush_lift
            value: 3
            modifier: SET

      upthrust:
        display_name: "Upthrust"
        description: "Five blocks up. 428 x 5 = 2140 raised. The 4th layer is cut to 150 blocks and the chasms get nothing."
        icon: POLISHED_BLACKSTONE
        value_type: int
        value: 5
        requirements:
          - type: number_stat
            stat: circleLevel
            minimum: 9
            description: "Requires Circle Level 9"
          - type: number_stat
            stat: mastery_worldbreaker
            minimum: 60
            description: "Requires 60 Worldbreaker mastery"
        impacts:
          - type: stat_modifier
            stat: crush_lift
            value: 5
            modifier: SET
          # 2166 DUG + 2140 RAISED + 246 CHASMS WANTS 4552, OVER THE 3600 CEILING, SO
          # THIS PAYS TOO. DIG LEAVES 1434, THREE WHOLE LAYERS LEAVE 150, THE
          # FOURTH LAYER IS TRUNCATED TO THOSE 150 AND BOTH CHASMS GET ZERO.
          - type: mana_cost
            change: 80
