# =============================================================================
# worldbreaker_options.yml
# Spell option configuration for the Worldbreaker spell.
#
# BOTH FAULTS AND THE SLAB DECREMENT **ONE** SHARED int[] ALLOWANCE, which starts
# at terrain_budget = 2000 and is never topped up. Two counters would each be
# able to spend 2000; one counter makes destroyed + placed <= 2000 structural.
# Neither option changes damage: the slab crushes each target exactly once, so
# the damage multipliers below are capped at 1.3 and 28.6 x 1.3 = 37.2 stays well
# inside burstBudget(9) = 90.0.
# =============================================================================

options:

  # ---------------------------------------------------------------------------
  # rift_length - how far the faults run
  # ---------------------------------------------------------------------------
  rift_length:
    description: "How far the faults tear across the arena"
    icon: DEEPSLATE
    default_index: 1

    values:

      hairline:
        display_name: "Hairline"
        description: "Short faults. 20 blocks, 10 dig ticks, 660 dug."
        icon: CRACKED_DEEPSLATE_TILES
        value_type: int
        value: 20
        requirements:
          - type: number_stat
            stat: circleLevel
            minimum: 9
            description: "Requires Circle Level 9"
        impacts:
          - type: stat_modifier
            stat: rift_length
            value: 20
            modifier: SET

      standard:
        display_name: "Fracture"
        description: "30 block faults. 990 dug, 900 raised, 1890 total."
        icon: DEEPSLATE_BRICKS
        value_type: int
        value: 30
        impacts:
          - type: stat_modifier
            stat: rift_length
            value: 30
            modifier: SET

      world_end:
        display_name: "World End"
        description: "44 block faults. 2772 blocks wanted, cut at the 2000 cap."
        icon: BLACKSTONE
        value_type: int
        value: 44
        requirements:
          - type: number_stat
            stat: circleLevel
            minimum: 9
            description: "Requires Circle Level 9"
          - type: number_stat
            stat: mastery_worldbreaker
            minimum: 100
            description: "Requires 100 Worldbreaker mastery"
        impacts:
          - type: stat_modifier
            stat: rift_length
            value: 44
            modifier: SET
          # SPEC 4.3: 22 SITES x 33 x 2 = 1452 DUG PLUS 10 x 44 x 3 = 1320
          # RAISED IS 2772 BLOCKS, OVER THE 2000 CEILING. THIS MAX OPTION
          # THEREFORE PAYS EXTRA MANA. THE SHARED int[] STILL TRUNCATES THE
          # WRITE AT 2000 - THE OPTION BUYS A BIGGER JOB, NOT A BIGGER ALLOWANCE.
          - type: mana_cost
            change: 150

  # ---------------------------------------------------------------------------
  # crush_lift - how high the trapped slab is levered up
  # ---------------------------------------------------------------------------
  crush_lift:
    description: "How high the trapped slab is levered up"
    icon: SMOOTH_BLACKSTONE
    default_index: 1

    values:

      heave:
        display_name: "Heave"
        description: "One block up. 300 blocks raised."
        icon: BLACK_CONCRETE
        value_type: int
        value: 1
        requirements:
          - type: number_stat
            stat: circleLevel
            minimum: 9
            description: "Requires Circle Level 9"
        impacts:
          - type: stat_modifier
            stat: crush_lift
            value: 1
            modifier: SET
          # LESS LEVERAGE MEANS LESS OF A PIN, SO THE RAW HIT IS HARDER.
          - type: stat_modifier
            stat: damage
            value: 1.3
            modifier: MULTIPLY

      standard:
        display_name: "Lever"
        description: "Three blocks up. 900 blocks raised."
        icon: SMOOTH_BLACKSTONE
        value_type: int
        value: 3
        impacts:
          - type: stat_modifier
            stat: crush_lift
            value: 3
            modifier: SET

      upthrust:
        display_name: "Upthrust"
        description: "Five blocks up. 1500 blocks raised."
        icon: POLISHED_BLACKSTONE
        value_type: int
        value: 5
        requirements:
          - type: number_stat
            stat: circleLevel
            minimum: 9
            description: "Requires Circle Level 9"
          - type: number_stat
            stat: mastery_worldbreaker
            minimum: 60
            description: "Requires 60 Worldbreaker mastery"
        impacts:
          - type: stat_modifier
            stat: crush_lift
            value: 5
            modifier: SET
          # 990 DUG + 1500 RAISED IS 2490, OVER THE CEILING, SO THIS PAYS TOO.
          - type: mana_cost
            change: 80
