id: 'radiant_brand'
# WHETHER THE PLUGIN SHOULD LOAD THE SPELL. DEFAULT: TRUE
enabled: true

# LIGHT IS THE COUNTER-ELEMENT. THE X2.0 AGAINST THE UNDEAD AND THE UP-TO-X2.5 DARK
# AFFINITY GAP ARE APPLIED AUTOMATICALLY INSIDE AttackSpell.getPower, NOT HERE.
element: 'LIGHT'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'SRLLR'

# A BRAND BURSTS ONCE, WHEN THE MARK EXPIRES. NOTHING LANDS AT CAST TIME.
role: 'BURST'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 6
required_focus: 135

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 11

# BASE CAST TIME (SECONDS). SpellBudgets.castTimeRange(6) COLLAPSES TO THE SINGLE POINT
# 20 TICKS, SO 1.0 IS THE ONLY LEGAL CIRCLE-6 CAST TIME - NOT THE 1.75 OF THE OLD
# SECTION 6 SINGLE-VALUE LADDER, WHICH CAST TIME AS A RANGE RETIRED.
cast_time: 1.0

# MANA COST
mana_cost: 165

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# BASE DAMAGE OF THE SINGLE DETONATION. 14.8 x 1 = 14.8, INSIDE THE CIRCLE-6
# BURST BUDGET OF 34.1. NO hit_count KEY: ONE CAST, ONE DETONATION.
power: 14.8

# SECONDS THE MARK SURVIVES BEFORE IT DETONATES
brand_duration: 4.0

# HOW FAR THE CASTER MAY REACH TO SET THE BRAND
brand_range: 32.0

# RADIUS OF THE DETONATION'S SPLASH
detonation_radius: 2.5

# FRACTION OF power TAKEN BY EACH SPLASH TARGET. THE BRANDED TARGET ALWAYS TAKES
# THE FULL power; ONLY NEARBY BYSTANDERS TAKE THIS FRACTION.
splash_fraction: 0.5

# TICKS BETWEEN MARK PARTICLE DRAWS. MARK VISUALS ONLY - NO TICK DAMAGE.
particle_interval: 2

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'YELLOW'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'BLAZE_POWDER'
gui_custom_model_data: 4155

prepare_sound: 'BLOCK_BEACON_AMBIENT'
cast_sound: 'BLOCK_CONDUIT_ATTACK_TARGET'
