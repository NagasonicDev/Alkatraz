id: 'crown_of_dawn'
# WHETHER THE PLUGIN SHOULD LOAD THE SPELL. DEFAULT: TRUE
enabled: true

# A WALL OF LIGHT IS NOT TERRAIN. NO BLOCK IS EVER PLACED, CHANGED OR RESTORED -
# LIGHT NEVER RESHAPES LAND. THE WALL IS PARTICLES, A PUSH AND AN EXECUTION.
element: 'LIGHT'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'SSSSL'

# A DENIAL SPELL'S INCIDENTAL DAMAGE IS CAPPED AT THE SAME-CIRCLE BURST BUDGET.
# THE EXECUTION IS NOT DAMAGE - IT IS THE DENIAL, AND IT IS NOT PRICED HERE.
denial_damage_cap: 90.0
role: 'DENIAL'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 9
required_focus: 161

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 20

# BASE CAST TIME (SECONDS). SpellBudgets.castTimeRange(9) COLLAPSES TO THE SINGLE POINT
# 40 TICKS, SO 2.0 IS THE ONLY LEGAL CIRCLE-9 CAST TIME - NOT THE 3.0 OF THE OLD
# SECTION 6 SINGLE-VALUE LADDER, WHICH CAST TIME AS A RANGE RETIRED. THE 300-TICK WALL
# BELOW IS A POST-CAST FIELD LIFETIME, NOT THE CAST, AND IS NOT DERIVED FROM IT.
cast_time: 2.0

# MANA COST
mana_cost: 600

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# INCIDENTAL CONTACT DAMAGE, AT MOST ONCE PER SpellAttackContext.DAMAGE_INTERVAL_TICKS.
# 6.0 x 15 PASSES = 90.0, WHICH IS EXACTLY denial_damage_cap ABOVE. THE POWER IS
# DERIVED FROM THE CAP, NOT INVENTED: THE CAP IS THE CIRCLE-9 BURST BUDGET.
# NOTE: AttackProperties.hasHit IS PER-CAST, SO ONE ENTITY ABSORBS ONE 6.0
# APPLICATION PER CAST. THE 90.0 IS THE CAST'S TOTAL CEILING ACROSS ALL ENTITIES.
power: 6.0

# FIFTEEN DAMAGE PASSES PER CAST:
# wall_duration 15.0s = 300 TICKS, DIVIDED BY THE 20-TICK CONTRACT INTERVAL.
# SpellBudgetTest READS power x hit_count AS THE PER-CAST TOTAL, WHICH IS 90.0.
hit_count: 15

# SECONDS THE WALL STANDS
wall_duration: 15.0

# BLOCKS THE WALL SPANS, MEASURED ALONG THE CASTER'S AIM
wall_length: 9.0

# BLOCKS THE WALL REACHES UPWARD
wall_height: 3.5

# HITPOINTS ON THE WALL's BarrierProperties. THE BOSS BAR READS THE EXISTING
# spells.barrier.health_bar KEY, SO THERE IS NO NEW LANG ENTRY FOR IT.
barrier_hitpoints: 60.0

# HALF THICKNESS OF THE WALL BAND IN BLOCKS. THE PUSH AND THE DAMAGE SCAN BOTH
# USE wall_half_thickness + 0.6, SO 1.5 AT THE DEFAULTS.
wall_half_thickness: 0.9

# HORIZONTAL VELOCITY ADDED TO EVERYTHING IN THE BAND, EVERY TICK. THIS IS THE
# Barrier.java PUSH WITH ITS LITERAL 0.3 REPLACED BY A CONFIGURABLE VALUE.
# WITHOUT IT AN ENEMY WALKS STRAIGHT THROUGH THE WALL.
push_strength: 0.45

# ANYTHING IN THE BAND BELOW THIS FRACTION OF ITS MAX HEALTH IS EXECUTED. THE
# COMPARISON IS STRICT, SO AN ENTITY AT EXACTLY 30% SURVIVES.
execution_threshold: 0.3

# BLOCKS BETWEEN ADJACENT WALL SEGMENTS
segment_spacing: 0.5

# TICKS THE WALL TAKES TO RISE TO FULL HEIGHT
rise_ticks: 10

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'WHITE'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'WHITE_STAINED_GLASS'
gui_custom_model_data: 4158

prepare_sound: 'BLOCK_BEACON_ACTIVATE'
cast_sound: 'ENTITY_ENDER_DRAGON_GROWL'
