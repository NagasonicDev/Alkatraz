id: 'crown_of_dawn'
# WHETHER THE PLUGIN SHOULD LOAD THE SPELL. DEFAULT: TRUE
enabled: true

# A CRONE OF LIGHT IS NOT TERRAIN. NO BLOCK IS EVER PLACED, CHANGED OR RESTORED -
# LIGHT NEVER RESHAPES LAND. THE CROWN IS A HOVER, A COLUMN AND AN ARMOUR SEAR.
element: 'LIGHT'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'SSSSL'

# THE CASTER IS HOVERED, NOT A WALL PLACED SOMEWHERE ELSE, AND THE DAMAGE LANDS
# EVERY damage_interval_ticks FOR AS LONG AS THE MANA HOLDS. THAT IS DAMAGE OVER
# TIME, SO THE LADDER JUDGES IT AS A SUSTAIN AGAINST sustainBudget(9) = 280.0.
role: 'SUSTAIN'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 9
required_focus: 161

# NO COOLDOWN. THE SECOND CAST IS WHAT TURNS THE CROWN OFF, AND A COOLDOWN WOULD
# LOCK THE CASTER INTO A SUSTAIN THEIR MANA HAS ALREADY SPENT.
cooldown: 0

# BASE CAST TIME (SECONDS). SpellBudgets.castTimeRange(9) COLLAPSES TO THE SINGLE POINT
# 40 TICKS, SO 2.0 IS THE ONLY LEGAL CIRCLE-9 CAST TIME - NOT THE 3.0 OF THE OLD
# SECTION 6 SINGLE-VALUE LADDER, WHICH CAST TIME AS A RANGE RETIRED. THE HOVER BELOW
# IS A POST-CAST FIELD LIFETIME, NOT THE CAST, AND IS NOT DERIVED FROM IT.
cast_time: 2.0

# MANA COST
mana_cost: 600

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# ARMOUR SEAR, PER OPENING. 8.0 x 30 OPENINGS = 240.0, AGAINST THE CIRCLE-9 SUSTAIN
# BUDGET OF 280.0. THE POWER IS DERIVED FROM THE BUDGET AND THE CADENCE, NOT INVENTED.
# NOTE: AttackProperties.hasHit IS PER-CAST, SO THE CADENCE LEDGER IN THE SPELL, NOT
# THE CONTEXT, IS WHAT PUTS THIRTY SEPARATE APPLICATIONS ON ONE TARGET.
power: 8.0

# THIRTY ARMOUR SEAR OPENINGS PER SUSTAIN:
# 60s AT ONE OPENING EVERY damage_interval_ticks (40 TICKS = 2s) IS 30.
hit_count: 30

# A LAUNCH, NOT A PUSH. ON THE OPENING TICK EVERY NON-PLAYER IN hover_radius IS LIFTED
# WITH THE CASTER.
hover_radius: 10.0
# BLOCKS THE CASTER RISES AND HOLDS AT, CEILING-CLAMPED TO THE GROUND BENEATH THEM.
hover_altitude: 6
# HOW OFTEN THE ARMOUR SEAR RUNS, IN TICKS. 40 TICKS = ONE OPENING EVERY 2s, AND 60s
# DIVIDED BY 2s IS THE 30 DECLARED IN hit_count.
damage_interval_ticks: 40
upkeep_mana_per_second: 60

# HOW LONG THE SUSTAIN MAY LAST, IN SECONDS. THIS IS THE ONLY THING HOLDING THE
# power x hit_count DECLARATION TRUE. THE ARITHMETIC: AFTER THE 600 CAST A CASTER HAS
# 9400 MANA; upkeep 60/s AGAINST 15/s REGEN IS A NET 45/s, SO THE MANA ALONE WOULD BUY
# 9400 / 45 = 208s - 104 OPENINGS x 8.0 = 832.0, ALMOST THREE TIMES THE CIRCLE-9
# SUSTAIN BUDGET OF 280.0, AND SpellBudgetTest CANNOT SEE IT BECAUSE IT ONLY READS
# power x hit_count FROM THIS FILE. duration_seconds IS ENFORCED IN THE SUSTAIN BODY,
# SO 60s AT ONE OPENING EVERY 2s IS EXACTLY THE 30 DECLARED IN hit_count = 240.0.
duration_seconds: 60.0

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'WHITE'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'WHITE_STAINED_GLASS'
gui_custom_model_data: 4158

prepare_sound: 'BLOCK_BEACON_ACTIVATE'
cast_sound: 'ENTITY_ENDER_DRAGON_GROWL'
