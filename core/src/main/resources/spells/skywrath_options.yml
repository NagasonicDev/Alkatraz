# Spell options for Skywrath's storm radius.
options:
  sky:
    description: "How much sky the storm claims"
    icon: FEATHER
    default_index: 1
    values:
      narrow:
        display_name: "Narrow Sky"
        description: "A tight 6 block storm."
        icon: FEATHER
        value_type: double
        value: 6.0
        impacts:
          - type: stat_modifier
            stat: storm_radius
            value: 6.0
            modifier: SET
      standard:
        display_name: "Open Sky"
        description: "The standard 8 block storm."
        icon: FEATHER
        value_type: double
        value: 8.0
        impacts:
          - type: stat_modifier
            stat: storm_radius
            value: 8.0
            modifier: SET
      wide:
        display_name: "Wide Sky"
        description: "A 10 block storm. Costs extra mana."
        icon: ELYTRA
        value_type: double
        value: 10.0
        requirements:
          - type: number_stat
            stat: circleLevel
            minimum: 9
            description: "Requires Circle Level 9"
          - type: number_stat
            stat: mastery_skywrath
            minimum: 75
            description: "Requires 75 Skywrath mastery"
        impacts:
          - type: stat_modifier
            stat: storm_radius
            value: 10.0
            modifier: SET
          - type: mana_cost
            change: 150
