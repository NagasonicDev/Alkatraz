id: 'earth_spike'
display_name: '#A0522DEarth Spike'
description:
  - '&7Creates a spike of condensed rock,'
  - '&7launching enemies up and dealing damage.'
# WHETHER THE PLUGIN SHOULD LOAD THE SPELL. DEFAULT: TRUE
enabled: true

# NONE MEANS ITS DAMAGE DOES NOT SCALE WITH ELEMENTAL DAMAGE, ONLY MAGIC DAMAGE
element: 'EARTH'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'RLRSR'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 2
required_focus: 40

# COOLDOWN BEFORE CASTING AGAIN
cooldown: 5

# BASE CAST TIME (SECONDS)
cast_time: 0.75

# MANA COST
mana_cost: 24

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 200

# BASE DAMAGE PER TARGET PER CAST. The rising steps are deduped through
# AttackProperties.hasHit, so a target caught by overlapping columns takes this
# once - previously they took one hit per rising step, 35 to 105 in total.
power: 5.5

role: 'BURST'

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'GREEN'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'POINTED_DRIPSTONE'
gui_custom_model_data: 4122

# SELF-DESTRUCT: Ticks after spike finishes rising before blocks are restored (20 ticks = 1 second)
self_destruct_ticks: 100

# WHETHER THIS SPELL CAN DESTROY/modify BLOCKS. DEFAULT: TRUE
block_damage: true

# IF > 0, DESTROYED/MOVED BLOCKS REAPPEAR AFTER THIS MANY SECONDS (FORCED RECOVER). SET TO 0 TO DISABLE.
recover_time: 0

cast_sound: 'BLOCK_GRAVEL_BREAK'
cast_sound_volume: 0.6


