# =============================================================================
# crown_of_dawn_options.yml
# Spell option configuration for the Crown of Dawn spell.
#
# Structure overview:
#   options:
#     <option-id>:
#       description:   <string>
#       icon:          <Material name>
#       default_index: <int>   # 0-based index into 'values' list order
#       values:
#         <value-id>:
#           display_name: <string>
#           description:  <string>
#           icon:         <Material name>
#           value_type:   int | double | float | boolean | string | auto
#           value:        <typed value>
#           requirements: [...]   # optional
#           impacts:      [...]   # optional
# =============================================================================
#
# NEITHER OPTION CHANGES HOW HARD THE CROWN HITS. THE SEAR IS power 8.0 ONCE EVERY
# damage_interval_ticks REGARDLESS, SO THE PER-TARGET TOTAL IS PINNED AT
# power x hit_count = 240.0 REGARDLESS. WHAT THEY CHANGE IS HOW MUCH ROOM YOU HOLD
# IT OVER AND HOW HIGH ABOVE THAT ROOM YOU FLOAT - both are area and shape, not
# damage, so NEITHER OPTION CARRIES A mana_cost IMPACT.
# =============================================================================

options:

  # ---------------------------------------------------------------------------
  # hover_radius - how much room the crown holds
  # ---------------------------------------------------------------------------
  hover_radius:
    description: "How far the crown of dawn reaches"
    icon: WHITE_STAINED_GLASS
    default_index: 1

    values:

      narrow:
        display_name: "Narrow Dawn"
        description: "Eight blocks of dawn."
        icon: WHITE_STAINED_GLASS_PANE
        value_type: double
        value: 8.0
        impacts:
          - type: stat_modifier
            stat: hover_radius
            value: 8.0
            modifier: SET

      dawn:
        display_name: "Dawn"
        description: "The ten blocks the spell casts with by default."
        icon: WHITE_STAINED_GLASS
        value_type: double
        value: 10.0
        impacts:
          - type: stat_modifier
            stat: hover_radius
            value: 10.0
            modifier: SET

      world:
        display_name: "Dawn of the World"
        description: "Fourteen blocks of dawn."
        icon: LIGHTNING_ROD
        value_type: double
        value: 14.0
        requirements:
          - type: number_stat
            stat: circleLevel
            minimum: 9
            description: "Requires Circle Level 9"
          - type: number_stat
            stat: mastery_crown_of_dawn
            minimum: 60
            description: "Requires 60 Crown of Dawn mastery"
        impacts:
          - type: stat_modifier
            stat: hover_radius
            value: 14.0
            modifier: SET

  # ---------------------------------------------------------------------------
  # hover_altitude - how high above that room you float
  # ---------------------------------------------------------------------------
  hover_altitude:
    description: "How high the crown of dawn holds you"
    icon: LADDER
    default_index: 1

    values:

      low:
        display_name: "Low Dawn"
        description: "Breaks ankles. Three blocks."
        icon: OAK_SLAB
        value_type: int
        value: 3
        impacts:
          - type: stat_modifier
            stat: hover_altitude
            value: 3.0
            modifier: SET

      dawn:
        display_name: "Dawn"
        description: "The six blocks the spell casts with by default."
        icon: WHITE_STAINED_GLASS
        value_type: int
        value: 6
        impacts:
          - type: stat_modifier
            stat: hover_altitude
            value: 6.0
            modifier: SET

      vault:
        display_name: "Vault"
        description: "Nine blocks. Nothing vaults it."
        icon: LIGHTNING_ROD
        value_type: int
        value: 9
        requirements:
          - type: number_stat
            stat: circleLevel
            minimum: 9
            description: "Requires Circle Level 9"
          - type: number_stat
            stat: mastery_crown_of_dawn
            minimum: 80
            description: "Requires 80 Crown of Dawn mastery"
        impacts:
          - type: stat_modifier
            stat: hover_altitude
            value: 9.0
            modifier: SET
