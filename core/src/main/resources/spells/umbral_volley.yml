id: 'umbral_volley'
# WHETHER THE PLUGIN SHOULD LOAD THE SPELL. DEFAULT: TRUE
enabled: true

# ELEMENT TYPE
element: 'DARK'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'LRSLR'

# BURST / SUSTAIN / TERRAIN / DENIAL / UTILITY - MUST BE ALLOWED FOR THE ELEMENT.
# DARK ALLOWS {UTILITY, SUSTAIN, BURST}. DENIAL IS FORBIDDEN OUTRIGHT.
role: 'BURST'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 7
required_focus: 144

# COOLDOWN BEFORE CASTING AGAIN (SECONDS)
cooldown: 13

# BASE CAST TIME (SECONDS). SpellBudgets.castTimeRange(7) COLLAPSES TO THE SINGLE POINT
# 25 TICKS, SO 1.25 IS THE ONLY LEGAL CIRCLE-7 CAST TIME - NOT THE 2.0 OF THE OLD
# SECTION 6 SINGLE-VALUE LADDER, WHICH CAST TIME AS A RANGE RETIRED.
cast_time: 1.25

# MANA COST
mana_cost: 240

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# BASE POWER (DAMAGE IF IT HITS). 16 x 3 DARTS = 48, EXACTLY burstBudget(7) = 48.0.
# DEVIATION, SAME SHAPE AS inferno_pilgrimage: THE C7 LADDER POWER OF 18.9 CANNOT CARRY
# A 3-DART VOLLEY WITHOUT GOING OVER BUDGET (18.9 x 3 = 56.7).
power: 16

# DISCRETE DAMAGE APPLICATIONS ONE CAST MAKES TO A SINGLE TARGET AT DEFAULT OPTIONS.
# MANDATED BY SpellBudgetTest, WHICH MULTIPLIES power x hit_count. THIS IS THE DART
# COUNT: EACH DART CONSUMES ITSELF ON ITS FIRST IMPACT, SO THREE DARTS THROUGH ONE
# BODY MEAN THREE DISCRETE HITS AND NOTHING ELSE - THE SPLIT SHARDS DEAL NO DAMAGE.
hit_count: 3

# VOLLEY SHAPE
dart_count: 3
dart_spread: 12.0
dart_speed: 0.9
dart_range: 26.0
dart_lifetime_ticks: 40

# TRACKING
dart_track_range: 18.0
dart_homing: 0.35

# THE SPLIT - VISUAL ONLY, THE SHARDS DEAL NO DAMAGE AND CARRY NO SPELL COMPONENT
split_count: 2
split_shard_ticks: 6
split_speed: 0.55

# THE CURSE. THESE TWO EFFECTS OUTLIVE THE CAST BY CONSTRUCTION: NOTHING IN THE CLASS
# REMOVES THEM, SO VANILLA EXPIRES THEM debuff_duration SECONDS AFTER THEY ARE APPLIED.
# WEAKNESS AND BLINDNESS ONLY - NEITHER DEALS DAMAGE, AND THERE IS NO WITHER.
debuff_duration: 8
debuff_weakness_amplifier: 1
debuff_blindness_amplifier: 0

# MOBS FIRE A SMALLER VOLLEY AT HALF THE FAN
mob_dart_count: 2

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'PURPLE'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'SPECTRAL_ARROW'
gui_custom_model_data: 4159

prepare_sound: 'ENTITY_PHANTOM_AMBIENT'
prepare_sound_volume: 0.4
prepare_sound_pitch: 1.4
cast_sound: 'ENTITY_WITHER_SHOOT'
cast_sound_volume: 0.8
cast_sound_pitch: 1.2