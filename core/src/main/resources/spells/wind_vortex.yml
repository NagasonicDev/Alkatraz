id: 'wind_vortex'
# WHETHER THE PLUGIN SHOULD LOAD THE SPELL. DEFAULT: TRUE
enabled: true

# ELEMENT TYPE
element: 'AIR'

# THE CASTING CODE. 'R' FOR RIGHT CLICK, 'L' FOR LEFT CLICK, 'S' FOR HAND SWAP
code: 'SRLRS'

# THE MAGIC CIRCLE REQUIRED TO CAST
level: 2
required_focus: 40

# COOLDOWN BEFORE CASTING AGAIN (SECONDS)
cooldown: 5

# BASE CAST TIME (SECONDS)
cast_time: 1.0

# MANA COST
mana_cost: 24

# MAXIMUM MASTERY ACHIEVABLE. NOT RECOMMENDED TO CHANGE
maximum_mastery: 100

# BASE DAMAGE PER HIT. The field damages a target at most once every
# SpellAttackContext.DAMAGE_INTERVAL_TICKS (20) ticks. Over the default 5 second
# duration that is 5 hits.
power: 0.5

# VORTEX CONFIGURATION
vortex_duration: 5
vortex_radius: 8.0
pull_strength: 0.4
tick_rate: 1

# WHAT THE SPELL IS JUDGED ON. A SUSTAIN field damages a target at most once per
# second - see spec section 5.2.
role: 'SUSTAIN'

#THE COLOR OF THE SPELL MASTERY BOSSBAR. OPTIONS ARE: RED, BLUE, YELLOW, PINK, PURPLE, WHITE AND GREEN
mastery_bar_color: 'WHITE'

#THE ITEM THAT APPEARS IN THE /SPELLS GUI
gui_item: 'FEATHER'
gui_custom_model_data: 4133

cast_sound: 'ENTITY_ENDER_DRAGON_FLAP'
cast_sound_volume: 0.6
