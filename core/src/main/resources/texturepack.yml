# Centralized texture pack configuration for Alkatraz
# This file manages all custom model data and ASCII codes used by the plugin

# Resource pack configuration
resource_pack:
  enabled: false
  url: ""  # URL for automatic resource pack download
  hash: "" # SHA-1 hash for resource pack verification
  prompt: "Alkatraz Texture Pack"
  message: "&aPlease download and install the Alkatraz texture pack for full visual experience!"

# ASCII codes for menu titles and special characters
# These use Unicode Private Use Area (PUA) characters
ascii_codes:
  menu_titles:
    spells: "\uF808\uF001"
    equipment: "\uF808\uF002"
    research: "\uF808\uF003"
    recipes: "\uF808\uF004"
    stats: "\uF808\uF005"
    grimoire: "\uF808\uF006"
  icons:
    back: "\uF808\u1001"
    confirm: "\uF808\u1002"
    cancel: "\uF808\u1003"
    info: "\uF808\u1004"

