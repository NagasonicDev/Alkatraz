name: Test Plugin Compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Edit this list to control which MC versions and loaders you test.
# Add/remove entries here — everything downstream reads from this.
env:
  MC_VERSIONS_JSON: '["1.20.1", "1.20.4", "1.21.1", "1.21.4"]'
  LOADERS_JSON: '["paper", "purpur", "spigot"]'

jobs:
  # ---------------------------------------------------------------------
  # 1. Fast unit tests (MockBukkit or plain JUnit) - fail fast, no server boot
  # ---------------------------------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run unit tests
        run: mvn -B test

  # ---------------------------------------------------------------------
  # 2. Build the plugin jar once, share it across every matrix job
  # ---------------------------------------------------------------------
  build-plugin:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin jar
        run: mvn -B package -DskipTests
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          # Excludes the *-sources.jar / *-original.jar that shade/some
          # plugins also drop in target/ - adjust the glob if your
          # artifactId produces something these patterns don't match.
          path: |
            target/*.jar
            !target/*-sources.jar
            !target/original-*.jar
          retention-days: 1

  # ---------------------------------------------------------------------
  # 3. Build Spigot jars via BuildTools - ONCE per MC version, then cached.
  #    This is the only loader that needs NMS remapping; every other
  #    loader fetches a prebuilt jar directly in the test job below.
  #    Cache hits skip BuildTools entirely on every subsequent run.
  # ---------------------------------------------------------------------
  build-spigot-jars:
    needs: unit-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc_version: [1.20.1, 1.20.4, 1.21.1, 1.21.4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Spigot jar
        id: cache-spigot
        uses: actions/cache@v4
        with:
          path: spigot-jars/spigot-${{ matrix.mc_version }}.jar
          # bump the -v1 suffix if you ever need to force a rebuild
          key: spigot-jar-${{ matrix.mc_version }}-v1
      - name: Build Spigot via BuildTools (cache miss only)
        if: steps.cache-spigot.outputs.cache-hit != 'true'
        run: |
          mkdir -p spigot-jars
          chmod +x scripts/build-spigot.sh
          scripts/build-spigot.sh "${{ matrix.mc_version }}" "spigot-jars/spigot-${{ matrix.mc_version }}.jar"

  # ---------------------------------------------------------------------
  # 4. Integration test matrix: every MC version x every loader.
  #    Paper/Purpur fetch prebuilt jars directly (fast, no build step).
  #    Spigot restores the jar cached in the job above (no rebuild).
  # ---------------------------------------------------------------------
  integration-test:
    needs: [build-plugin, build-spigot-jars]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc_version: [1.20.1, 1.20.4, 1.21.1, 1.21.4]
        loader: [paper, purpur, spigot]
        # Add exclusions here if a given loader doesn't publish a
        # particular version yet, e.g.:
        # exclude:
        #   - mc_version: 1.21.4
        #     loader: spigot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-jar
          path: dist

      - name: Restore cached Spigot jar
        if: matrix.loader == 'spigot'
        uses: actions/cache@v4
        with:
          path: spigot-jars/spigot-${{ matrix.mc_version }}.jar
          key: spigot-jar-${{ matrix.mc_version }}-v1

      - name: Fetch server jar
        run: |
          mkdir -p servers
          chmod +x scripts/*.sh
          case "${{ matrix.loader }}" in
            paper)
              scripts/fetch-paper.sh "${{ matrix.mc_version }}" servers/server.jar
              ;;
            purpur)
              scripts/fetch-purpur.sh "${{ matrix.mc_version }}" servers/server.jar
              ;;
            spigot)
              cp "spigot-jars/spigot-${{ matrix.mc_version }}.jar" servers/server.jar
              ;;
          esac

      - name: Run integration test
        run: |
          PLUGIN_JAR=$(find dist -name '*.jar' | head -n1)
          if [ -z "$PLUGIN_JAR" ]; then
            echo "::error::No plugin jar found in downloaded artifact"
            exit 1
          fi
          scripts/run-server-test.sh servers/server.jar "$PLUGIN_JAR" "${{ matrix.loader }}" "${{ matrix.mc_version }}"

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ matrix.loader }}-${{ matrix.mc_version }}
          path: /tmp/mc-test-*/server.log
          retention-days: 7
