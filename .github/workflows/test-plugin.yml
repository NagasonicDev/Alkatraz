name: Test Plugin Compatibility

on:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------
  # 0. Turn nms-versions.txt into a JSON array for the build-nms matrix.
  # ---------------------------------------------------------------------
  load-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set.outputs.versions }}
      mc_versions: ${{ steps.set.outputs.mc_versions }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          JSON=$(grep -v '^\s*#' .github/workflows/nms-versions.txt | grep -v '^\s*$' | jq -R -s -c 'split("\n") | map(select(length > 0)) | map(split(",") | {version: .[0], java: .[1]})')
          echo "versions=$JSON" >> "$GITHUB_OUTPUT"
          MC=$(echo "$JSON" | jq -c '[.[].version]')
          echo "mc_versions=$MC" >> "$GITHUB_OUTPUT"
          echo "Versions: $JSON"
          echo "MC versions: $MC"

  # ---------------------------------------------------------------------
  # 1. Build (or restore from cache) the remapped Spigot artifacts for
  #    every version in nms-versions.txt. This is the ONLY job that ever
  #    invokes BuildTools. Each version gets its own cache entry, so a
  #    version is only ever rebuilt once, no matter how many times the
  #    workflow runs afterwards.
  #
  #    Produces, per version, staged under ./nms-stage:
  #      nms-stage/m2/org/spigotmc/...   -> compile-time Maven deps
  #      nms-stage/m2/org/bukkit/...     -> compile-time Maven deps
  #      nms-stage/jars/spigot-<v>.jar   -> runnable server jar
  # ---------------------------------------------------------------------
  build-nms:
    needs: load-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache remapped Spigot artifacts
        id: cache
        uses: actions/cache@v4
        with:
          path: nms-stage
          # Bump this suffix (-v1 -> -v2) to force a rebuild of every
          # version, e.g. if Spigot re-patches something retroactively.
          key: spigot-nms-${{ matrix.version }}-v5.4

      - name: Build with BuildTools (cache miss only)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p nms-stage/m2/org/spigotmc nms-stage/m2/org/bukkit nms-stage/jars
          chmod +x scripts/build-spigot.sh
          scripts/build-spigot.sh "${{ matrix.version }}" "nms-stage/jars/spigot-${{ matrix.version }}.jar"
          if [ -d "$HOME/.m2/repository/org/spigotmc" ]; then cp -r "$HOME/.m2/repository/org/spigotmc/." nms-stage/m2/org/spigotmc/; fi
          if [ -d "$HOME/.m2/repository/org/bukkit" ]; then cp -r "$HOME/.m2/repository/org/bukkit/." nms-stage/m2/org/bukkit/; fi

      - name: Upload artifact for this run
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nms-${{ matrix.version }}
          path: nms-stage
          retention-days: 1

  # ---------------------------------------------------------------------
  # 2. Unit tests - needs every version's compile artifacts present in
  #    the local Maven repo before `mvn test` can even resolve deps.
  # ---------------------------------------------------------------------
  unit-tests:
    needs: build-nms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Download and install all NMS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nms-*
          path: nms-merged
          merge-multiple: true
      - name: Install into local Maven repo
        run: |
          mkdir -p "$HOME/.m2/repository"
          if [ -d nms-merged/m2 ]; then cp -r nms-merged/m2/. "$HOME/.m2/repository/"; fi

      - name: Run unit tests
        run: mvn -B test

  # ---------------------------------------------------------------------
  # 3. Build the plugin jar once, share it across every integration test.
  # ---------------------------------------------------------------------
  build-plugin:
    needs: build-nms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Download and install all NMS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nms-*
          path: nms-merged
          merge-multiple: true
      - name: Install into local Maven repo
        run: |
          mkdir -p "$HOME/.m2/repository"
          if [ -d nms-merged/m2 ]; then cp -r nms-merged/m2/. "$HOME/.m2/repository/"; fi

      - name: Build plugin jar
        run: mvn -B package -DskipTests
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: |
            dist/target/*.jar
            !dist/target/*-sources.jar
            !dist/target/original-*.jar
          retention-days: 1

  # ---------------------------------------------------------------------
  # 4. Integration test matrix: every MC version x every loader.
  #    Paper/Purpur fetch prebuilt jars directly. Spigot pulls its
  #    runnable jar out of the version's nms-<version> artifact - no
  #    BuildTools invocation happens here.
  # ---------------------------------------------------------------------
  integration-test:
    needs: [build-plugin, build-nms, load-versions]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc_version: ${{ fromJson(needs.load-versions.outputs.mc_versions) }}
        loader: [paper, purpur, spigot]
        # Add exclusions here if a given loader doesn't publish a
        # particular version, e.g.:
        # exclude:
        #   - mc_version: 26.2
        #     loader: purpur
    steps:
      - uses: actions/checkout@v4
      - name: Determine Java version
        id: java
        run: |
          if [[ "${{ matrix.mc_version }}" == 26* ]]; then
            echo "version=26" >> "$GITHUB_OUTPUT"
          elif [[ "${{ matrix.mc_version }}" == 1.19* ]]; then
            echo "version=17" >> "$GITHUB_OUTPUT"
          else
            echo "version=21" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}

      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-jar
          path: dist

      - name: Download Spigot server jar
        if: matrix.loader == 'spigot'
        uses: actions/download-artifact@v4
        with:
          name: nms-${{ matrix.mc_version }}
          path: nms-download

      - name: Debug artifact contents
        if: matrix.loader == 'spigot'
        run: |
          echo "=== nms-download contents ==="
          find nms-download -type f 2>/dev/null || echo "(nms-download directory is empty or missing)"

      - name: Fetch server jar
        run: |
          mkdir -p servers
          chmod +x scripts/*.sh
          case "${{ matrix.loader }}" in
            paper)
              scripts/fetch-paper.sh "${{ matrix.mc_version }}" servers/server.jar
              ;;
            purpur)
              scripts/fetch-purpur.sh "${{ matrix.mc_version }}" servers/server.jar
              ;;
            spigot)
              JAR="nms-download/jars/spigot-${{ matrix.mc_version }}.jar"
              if [ ! -f "$JAR" ]; then
                echo "::error::Spigot jar not found at ${JAR} — the build-nms job may have failed or the artifact structure changed"
                echo "Expected: nms-${{ matrix.mc_version }} artifact with jars/spigot-${{ matrix.mc_version }}.jar"
                exit 1
              fi
              cp "$JAR" servers/server.jar
              ;;
          esac

      - name: Run integration test
        run: |
          PLUGIN_JAR=$(find dist -name '*.jar' | head -n1)
          if [ -z "$PLUGIN_JAR" ]; then
            echo "::error::No plugin jar found in downloaded artifact"
            exit 1
          fi
          scripts/run-server-test.sh servers/server.jar "$PLUGIN_JAR" "${{ matrix.loader }}" "${{ matrix.mc_version }}"

      - name: Copy test results to workspace
        if: always()
        run: |
          RESULTS=$(ls /tmp/mc-test-*/test-results.txt 2>/dev/null | head -1)
          if [ -n "$RESULTS" ]; then
            cp "$RESULTS" "test-results-${{ matrix.loader }}-${{ matrix.mc_version }}.txt"
            echo "Test results captured from $RESULTS"
          else
            echo "LOADER=${{ matrix.loader }}" > "test-results-${{ matrix.loader }}-${{ matrix.mc_version }}.txt"
            echo "VERSION=${{ matrix.mc_version }}" >> "test-results-${{ matrix.loader }}-${{ matrix.mc_version }}.txt"
            echo "PASS=0" >> "test-results-${{ matrix.loader }}-${{ matrix.mc_version }}.txt"
            echo "FAIL=0" >> "test-results-${{ matrix.loader }}-${{ matrix.mc_version }}.txt"
            echo "SECTIONS:" >> "test-results-${{ matrix.loader }}-${{ matrix.mc_version }}.txt"
            echo "(no results file found)" >> "test-results-${{ matrix.loader }}-${{ matrix.mc_version }}.txt"
          fi

      - name: Extract plugin warnings
        if: always()
        run: |
          LOG=$(ls /tmp/mc-test-*/server.log 2>/dev/null | head -1)
          WARN_FILE="warnings-${{ matrix.loader }}-${{ matrix.mc_version }}.txt"
          ERROR_FILE="errors-${{ matrix.loader }}-${{ matrix.mc_version }}.txt"

          if [ -n "$LOG" ] && grep -q 'WARN\].*\[Alkatraz\]' "$LOG" 2>/dev/null; then
            # Keep only unexpected warnings: extract the [Alkatraz] message
            # (timestamp stripped), collapse repeats across reloads, then drop
            # the intentionally produced warnings from the CI-only recipe
            # fixtures. Each pattern maps to fixtures in
            # scripts/test-fixtures/recipes/.
            grep 'WARN\].*\[Alkatraz\]' "$LOG" \
              | grep -oE '\[Alkatraz\].*' \
              | sort -u \
              | grep -vE "\[Alkatraz\] (Duplicate recipe key overwritten: alkatraz:ci_(dup|override)|Empty ingredients for shapeless recipe alkatraz:ci_bad_ingredient|Empty recipe shape for alkatraz:ci_bad_(shape|type)|Recipe key minecraft:stick conflicts with an existing Bukkit recipe; set override_vanilla: true to replace it|Recipe missing 'definition'/'id' key|Unknown ingredient 'definitely_not_a_material' in recipe|Unknown recipe type 'WAFFLE', defaulting to SHAPED)" \
              > "$WARN_FILE" || true
            COUNT=$(wc -l < "$WARN_FILE")
            echo "Found ${COUNT} unique unexpected warning(s)"
          else
            touch "$WARN_FILE"
          fi

          if [ -n "$LOG" ] && grep -q 'ERROR\].*\[Alkatraz\]' "$LOG" 2>/dev/null; then
            grep 'ERROR\].*\[Alkatraz\]' "$LOG" | sort -u > "$ERROR_FILE"
          else
            touch "$ERROR_FILE"
          fi

          echo "Warnings: $(wc -l < "$WARN_FILE"), Errors: $(wc -l < "$ERROR_FILE")"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.loader }}-${{ matrix.mc_version }}
          path: test-results-*.txt
          retention-days: 1

      - name: Upload warnings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alerts-${{ matrix.loader }}-${{ matrix.mc_version }}
          path: |
            warnings-*.txt
            errors-*.txt
          retention-days: 1

      - name: Upload server log on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ matrix.loader }}-${{ matrix.mc_version }}
          path: /tmp/mc-test-*/server.log
          retention-days: 7

  # ---------------------------------------------------------------------
  # 5. Consolidated warning report — collects warnings from every
  #    integration-test run into a single summary.
  # ---------------------------------------------------------------------
  report-warnings:
    needs: integration-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all alert artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: alerts-*
          path: all-alerts
          merge-multiple: true

      - name: Download all test result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: all-test-results
          merge-multiple: true

      - name: Generate summary
        run: |
          echo "## Test Results Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          TOTAL_PASS=0
          TOTAL_FAIL=0
          FOUND_RESULTS=false

          for f in all-test-results/test-results-*.txt; do
            [ -f "$f" ] || continue
            NAME=$(basename "$f" .txt | sed 's/^test-results-//')
            PASS=$(grep '^PASS=' "$f" | cut -d= -f2)
            FAIL=$(grep '^FAIL=' "$f" | cut -d= -f2)
            PASS=${PASS:-0}
            FAIL=${FAIL:-0}

            FOUND_RESULTS=true
            TOTAL_PASS=$((TOTAL_PASS + PASS))
            TOTAL_FAIL=$((TOTAL_FAIL + FAIL))

            if [ "$FAIL" -gt 0 ]; then
              echo "| ${NAME} | ${PASS} | ❌ ${FAIL} |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::${NAME} — ${FAIL} test(s) failed"
            else
              echo "| ${NAME} | ✅ ${PASS} | 0 |" >> "$GITHUB_STEP_SUMMARY"
            fi

            # Show section breakdown and log snapshots if any failures
            if [ "$FAIL" -gt 0 ]; then
              SECTIONS=$(sed -n '/^SECTIONS:/,/^$/p' "$f" | grep -v '^SECTIONS:' | grep -v '^$' || true)
              LOG_SNAPS=$(sed -n '/^LOG_SNAPSHOTS:/,/^$/p' "$f" | grep -v '^LOG_SNAPSHOTS:' | grep -v '^$' || true)
              if [ -n "$SECTIONS" ] || [ -n "$LOG_SNAPS" ]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "<details><summary>${NAME} — failure details</summary>" >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"
                if [ -n "$SECTIONS" ]; then
                  echo "**Test results:**" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  echo "$SECTIONS" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                fi
                if [ -n "$LOG_SNAPS" ]; then
                  echo "**Server log snapshot:**" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  echo "$LOG_SNAPS" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                fi
                echo "</details>" >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          done

          if [ "$FOUND_RESULTS" = true ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "---" >> "$GITHUB_STEP_SUMMARY"
            echo "**Total: ${TOTAL_PASS} passed, ${TOTAL_FAIL} failed**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No test results found." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Plugin Warnings Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          TOTAL_WARN=0
          TOTAL_ERR=0
          FOUND=false

          for f in all-alerts/errors-*.txt; do
            [ -f "$f" ] || continue
            NAME=$(basename "$f" .txt | sed 's/^errors-//')
            COUNT=$(wc -l < "$f")
            [ "$COUNT" -eq 0 ] && continue

            FOUND=true
            TOTAL_ERR=$((TOTAL_ERR + COUNT))
            echo "### ❌ ${NAME} — ${COUNT} error(s)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            while IFS= read -r line; do
              echo "::error::${NAME} - ${line}"
            done < "$f"
          done

          for f in all-alerts/warnings-*.txt; do
            [ -f "$f" ] || continue
            NAME=$(basename "$f" .txt | sed 's/^warnings-//')
            COUNT=$(wc -l < "$f")
            [ "$COUNT" -eq 0 ] && continue

            FOUND=true
            TOTAL_WARN=$((TOTAL_WARN + COUNT))
            echo "### ⚠️ ${NAME} — ${COUNT} warning(s)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            while IFS= read -r line; do
              echo "::warning::${NAME} - ${line}"
            done < "$f"
          done

          if [ "$FOUND" = false ]; then
            echo "No plugin warnings found across all versions." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "---" >> "$GITHUB_STEP_SUMMARY"
            echo "**Total unique warnings: ${TOTAL_WARN}**" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$TOTAL_FAIL" -gt 0 ]; then
            echo ""
            echo "::error::${TOTAL_FAIL} test(s) failed across all versions"
            exit 1
          fi